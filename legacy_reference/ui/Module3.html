async function renderDocuments(){const rows=await api('listDocuments',{});setContent(`<div class="page-head"><div><h2>${isMember()?'আমার ডকুমেন্ট':'ডকুমেন্টস'}</h2><p>NID, Member, Loan, Land ও Investment documents</p></div><div class="actions"><button class="btn btn-primary btn-sm" onclick="openDocumentUpload()">＋ Upload</button></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Title</th><th>Member</th><th>Related Type</th><th>File</th><th></th></tr></thead><tbody>${rows.map(d=>`<tr><td>${fmtDate(d.createdAt)}</td><td>${esc(d.title)}</td><td>${esc(d.memberId||'-')}</td><td>${esc(d.relatedType)}</td><td>${esc(d.fileName)}</td><td><button class="btn btn-light btn-sm" onclick="openDocument('${d.documentId}')">View</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">কোনো ডকুমেন্ট নেই।</td></tr>'}</tbody></table></div></div>`)}
async function openDocumentUpload(){const ms=isMember()?[]:await ensureMembersCache();modal('Document Upload',`<form id="docForm"><div class="form-grid">${isMember()?'':`<div class="field full"><label>Member (optional)</label><select class="select" name="memberId"><option value="">General / Other</option>${ms.map(m=>`<option value="${m.memberId}">${esc(m.memberId)} — ${esc(m.nameBn||m.nameEn)}</option>`).join('')}</select></div>`}<div class="field"><label>Title *</label><input class="input" name="title" required></div><div class="field"><label>Related Type</label><select class="select" name="relatedType"><option>MEMBER</option><option>LOAN</option><option>INVESTMENT</option><option>MEETING</option><option>OTHER</option></select></div><div class="field full"><label>File *</label><input class="input" id="docFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-primary" id="saveDoc">Upload</button>`);$('#saveDoc').onclick=async()=>{const f=$('#docForm');if(!f.reportValidity())return;const p=formObj(f);try{const doc=await safeDocumentPayload($('#docFile').files[0]);p.dataUrl=doc.dataUrl;await api('uploadDocument',p);closeModal();toast('ডকুমেন্ট আপলোড হয়েছে।');renderDocuments()}catch(e){toast(e.message,'error')}}}
async function openDocument(id){try{const d=await api('getDocumentData',id);if(d.mimeType?.startsWith('image/'))modal(esc(d.title),`<img src="${d.dataUri}" style="max-width:100%;display:block;margin:auto">`,`<button class="btn btn-light" onclick="closeModal()">বন্ধ</button>`,true);else if(d.mimeType==='application/pdf')modal(esc(d.title),`<iframe src="${d.dataUri}" style="width:100%;height:72vh;border:0"></iframe>`,`<button class="btn btn-light" onclick="closeModal()">বন্ধ</button>`,true);else{const a=document.createElement('a');a.href=d.dataUri;a.download=d.fileName||'document';a.click()}}catch(e){toast(e.message,'error')}}

const ND_GENERIC_TABLE={rows:[],cols:[],page:0,pageSize:100};
function ndGenericTableHtml_(){const {rows,cols,page,pageSize}=ND_GENERIC_TABLE;if(!rows.length)return '<div class="empty">কোনো ডাটা নেই।</div>';const pages=Math.max(1,Math.ceil(rows.length/pageSize)),safePage=Math.max(0,Math.min(page,pages-1)),start=safePage*pageSize,end=Math.min(rows.length,start+pageSize);ND_GENERIC_TABLE.page=safePage;return `<div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(start,end).map(r=>`<tr>${cols.map(c=>`<td>${typeof r[c]==='number'?Number(r[c]).toLocaleString('en-BD'):esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="pagination"><div class="helper">Showing ${start+1}-${end} of ${rows.length}</div><button class="btn btn-light btn-sm" ${safePage===0?'disabled':''} onclick="ndGenericTablePage(-1)">← Previous</button><span>${safePage+1} / ${pages}</span><button class="btn btn-light btn-sm" ${safePage>=pages-1?'disabled':''} onclick="ndGenericTablePage(1)">Next →</button></div>`}
function ndGenericTablePage(delta){ND_GENERIC_TABLE.page+=Number(delta||0);const target=$('#reportResult');if(target){target.innerHTML=ndGenericTableHtml_();target.scrollIntoView({behavior:'smooth',block:'start'})}}
function genericTable(rows){ND_GENERIC_TABLE.rows=rows||[];ND_GENERIC_TABLE.page=0;const all=rows&&rows.length?Object.keys(rows[0]).filter(k=>k!=='_row'):[],cols=all.slice(0,18);['NOTE_PURPOSE','ALLOCATION_METHOD','VOUCHER_ID'].forEach(k=>{if(all.includes(k)&&!cols.includes(k))cols.push(k)});ND_GENERIC_TABLE.cols=cols;return ndGenericTableHtml_()}
function exportCsv(rows,name){const cols=Object.keys(rows[0]).filter(k=>k!=='_row');const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[cols.map(q).join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}

async function renderNotifications(){const rows=await api('listNotifications');setContent(`<div class="page-head"><div><h2>নোটিফিকেশন ও নোটিশ</h2><p>সঞ্চয়, ঋণ, পেমেন্ট ও সাধারণ আপডেট</p></div><div class="actions">${isAdmin()?`<button class="btn btn-primary btn-sm" onclick="openBroadcastModal()">＋ Notice</button>`:''}</div></div><div class="card"><div class="card-body">${rows.length?rows.map(n=>`<div class="notice ${n.STATUS==='UNREAD'?'warn':''}" style="margin-bottom:8px;display:flex;justify-content:space-between;gap:10px"><div><b>${esc(n.TITLE)}</b><br>${esc(n.MESSAGE)}<div class="helper">${fmtDate(n.CREATED_AT)} · ${esc(n.TYPE)}</div></div>${n.STATUS==='UNREAD'?`<button class="btn btn-light btn-sm" onclick="readNotification('${n.NOTIFICATION_ID}')">Read</button>`:''}</div>`).join(''):'<div class="empty">কোনো নোটিফিকেশন নেই।</div>'}</div></div>`)}
async function readNotification(id){try{await api('markNotificationRead',id);renderNotifications();loadNotificationBadge()}catch(e){toast(e.message,'error')}}
function openBroadcastModal(){modal('নোটিশ প্রকাশ',`<form id="noticeForm"><div class="form-grid"><div class="field"><label>Type</label><select class="select" name="type"><option>NOTICE</option><option>MEETING</option><option>IMPORTANT</option></select></div><div class="field"><label>Member ID (blank = all admins/general)</label><input class="input" name="memberId"></div><div class="field full"><label>Title *</label><input class="input" name="title" required></div><div class="field full"><label>Message *</label><textarea class="textarea" name="message" required></textarea></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-primary" id="saveNotice">Publish</button>`);$('#saveNotice').onclick=async()=>{const f=$('#noticeForm');if(!f.reportValidity())return;try{await api('createBroadcastNotification',formObj(f));closeModal();toast('নোটিশ প্রকাশ হয়েছে।');renderNotifications()}catch(e){toast(e.message,'error')}}}
async function renderUsers(){const [users,roles]=await Promise.all([api('listUsers'),api('listRoles')]);window._roles=roles;setContent(`<div class="page-head"><div><h2>ব্যবহারকারী ও পারমিশন</h2><p>Admin, Staff, Accountant, Collector, Secretary, Viewer এবং Member Login</p></div><div class="actions"><button class="btn btn-primary btn-sm" onclick="openStaffUserModal()">＋ Staff User</button></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Username</th><th>Member ID</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td><b>${esc(u.username)}</b></td><td>${esc(u.memberId||'-')}</td><td>${statusBadge(u.role)}</td><td>${statusBadge(u.status)}</td><td>${fmtDate(u.lastLogin)}</td><td><button class="btn btn-outline btn-sm" onclick="openEditUser('${u.userId}','${esc(u.role)}','${esc(u.status)}')">Edit</button><button class="btn btn-light btn-sm" onclick="resetPassword('${u.userId}')">Reset Password</button></td></tr>`).join('')}</tbody></table></div></div><div class="card section-gap"><div class="card-head"><h3>Role Permission Summary</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Role</th><th>Name</th><th>Permissions</th><th>Action</th></tr></thead><tbody>${roles.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.name)}</td><td>${esc(r.permissions.join(', '))}</td><td>${r.id==='ADMIN'||r.id==='MEMBER'?'':`<button class="btn btn-light btn-sm" onclick="openRolePermissions('${r.id}')">Edit</button>`}</td></tr>`).join('')}</tbody></table></div></div>`)}
function openStaffUserModal(){const roles=window._roles||[];modal('নতুন Staff User',`<form id="staffForm"><div class="form-grid"><div class="field"><label>Full Name *</label><input class="input" name="name" required></div><div class="field"><label>Username *</label><input class="input" name="username" required></div><div class="field"><label>Role</label><select class="select" name="role">${roles.filter(r=>r.id!=='MEMBER').map(r=>`<option value="${r.id}">${esc(r.id)} — ${esc(r.name)}</option>`).join('')}</select></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-primary" id="saveStaff">Create User</button>`);$('#saveStaff').onclick=async()=>{const f=$('#staffForm');if(!f.reportValidity())return;try{const r=await api('createStaffUser',formObj(f));closeModal();modal('Temporary Login',`<div class="notice warn">এই Password একবারই দেখানো হচ্ছে।</div><div class="info-grid section-gap">${info('Username',r.username)}${info('Temporary Password',r.tempPassword)}</div>`,`<button class="btn btn-primary" onclick="closeModal();renderUsers()">OK</button>`)}catch(e){toast(e.message,'error')}}}
function openEditUser(id,role,status){const roles=window._roles||[];modal('User Update',`<form id="editUserForm"><div class="form-grid"><div class="field"><label>Role</label><select class="select" name="role">${roles.filter(r=>r.id!=='MEMBER').map(r=>`<option value="${r.id}" ${r.id===role?'selected':''}>${esc(r.id)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select class="select" name="status"><option ${status==='ACTIVE'?'selected':''}>ACTIVE</option><option ${status==='INACTIVE'?'selected':''}>INACTIVE</option></select></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-primary" id="saveUserEdit">Save</button>`);$('#saveUserEdit').onclick=async()=>{try{await api('updateUser',id,formObj($('#editUserForm')),'Admin user update');closeModal();toast('User updated.');renderUsers()}catch(e){toast(e.message,'error')}}}
async function resetPassword(id){if(!confirm('Password reset করবেন?'))return;try{const r=await api('resetUserPassword',id);modal('New Temporary Password',`<div class="notice warn">সদস্য/ব্যবহারকারীকে এই তথ্য দিন।</div><div class="info-grid section-gap">${info('Username',r.username)}${info('Temporary Password',r.tempPassword)}</div>`,`<button class="btn btn-primary" onclick="closeModal()">OK</button>`)}catch(e){toast(e.message,'error')}}


function openRolePermissions(roleId){
  const role=(window._roles||[]).find(r=>r.id===roleId);if(!role)return;
  const all=['dashboard.view','members.view','members.edit','savings.view','savings.collect','savings.edit','receipts.view','receipts.print','loans.view','loans.create','loans.payment','loans.approve','investments.view','investments.edit','profits.view','profits.edit','accounts.view','accounts.edit','meetings.view','meetings.edit','committee.view','committee.edit','documents.view','documents.edit','reports.view','audit.view','backup.manage','users.view','users.edit'];
  modal('Role Permissions — '+esc(roleId),`<div class="form-grid">${all.map(p=>`<label class="notice" style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="permBox" value="${p}" ${role.permissions.includes(p)?'checked':''}> ${p}</label>`).join('')}</div>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-primary" id="saveRolePerm">Save Permissions</button>`,true);
  $('#saveRolePerm').onclick=async()=>{try{const perms=$$('.permBox:checked').map(x=>x.value);await api('saveRolePermissions',roleId,perms);closeModal();toast('Permissions updated.');renderUsers()}catch(e){toast(e.message,'error')}};
}


async function renderBackup(){const rows=await api('listBackups');setContent(`<div class="page-head"><div><h2>ব্যাকআপ ও ডাটাবেজ</h2><p>Google Drive backup ও database health</p></div><div class="actions"><button class="btn btn-primary btn-sm" id="backupNow">💾 Backup Now</button></div></div><div class="notice">Daily automatic backup Setup-এর সময় install হয়। গুরুত্বপূর্ণ পরিবর্তনের আগে manual backup নেওয়া ভালো।</div><div class="card section-gap"><div class="table-wrap"><table class="table"><thead><tr><th>Backup ID</th><th>File Name</th><th>Created</th><th>By</th><th>Status</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${esc(b.backupId)}</td><td>${esc(b.fileName)}</td><td>${fmtDate(b.createdAt)}</td><td>${esc(b.createdBy)}</td><td>${statusBadge(b.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Backup history নেই।</td></tr>'}</tbody></table></div></div>`);$('#backupNow').onclick=async()=>{try{const r=await api('createBackup');toast('Backup তৈরি হয়েছে: '+r.fileName);renderBackup()}catch(e){toast(e.message,'error')}}}

async function renderSettings(){
  if(!isAdmin())throw new Error('PERMISSION_DENIED: ADMIN');
  const [rows,validation]=await Promise.all([api('getSettings'),api('getConfigValidationReport')]);
  const categories={GENERAL:'General Information',PREFIX:'ID and Document Prefix',SAVINGS:'Savings Settings',LOAN:'Loan Settings',INVESTMENT:'Investment Settings',REGIONAL:'Regional and Accounting Settings',SECURITY:'Security Settings'};
  const inputFor=r=>{const common=`class="${r.type==='select'?'select':'input'} setting-input" data-key="${esc(r.key)}" data-financial="${r.financial?'1':'0'}" data-initial="${esc(r.value)}" ${r.required?'required':''}`;if(r.type==='select')return `<select ${common}>${r.options.map(o=>`<option value="${esc(o)}" ${String(o)===String(r.value)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;if(r.type==='monthKey')return `<input ${common} type="month" value="${esc(r.value)}">`;if(r.type==='email')return `<input ${common} type="email" value="${esc(r.value)}">`;if(r.type==='mobile')return `<input ${common} type="tel" inputmode="tel" autocomplete="tel" value="${esc(r.value)}">`;if(['year','positiveMoney','money','percent','monthNumber','dueDay','nonNegativeInt','nonNegativeNumber','positiveInt'].includes(r.type))return `<input ${common} type="number" step="${['positiveMoney','money','percent','nonNegativeNumber'].includes(r.type)?'0.01':'1'}" value="${esc(r.value)}">`;return `<input ${common} type="text" value="${esc(r.value)}">`};
  const sections=Object.keys(categories).map(category=>`<section class="settings-section"><h3>${esc(categories[category])}</h3><div class="form-grid">${rows.filter(r=>r.category===category).map(r=>`<div class="field setting-field"><label>${esc(r.label)}${r.required?' *':''}</label>${inputFor(r)}<div class="helper">CONFIG: ${esc(r.key)} · ${esc(r.description)}${r.updatedAt?` · Updated ${esc(r.updatedAt)} by ${esc(r.updatedBy||'-')}`:''}</div>${r.canRestore?`<button type="button" class="btn btn-light btn-sm setting-restore" data-key="${esc(r.key)}" data-previous="${esc(r.previousValue)}">↶ Restore Previous Value</button>`:''}</div>`).join('')}</div></section>`).join('');
  setContent(`<div class="page-head"><div><h2>Administrator Settings</h2><p>Existing CONFIG sheet-এর অনুমোদিত VALUE fields; KEY ও protected values editable নয়</p></div></div><div class="notice ${validation.ok?'':'danger'}">Config validation: ${validation.ok?'PASS':'FAIL'} · ${validation.checked} fields checked${validation.errors.length?' · '+validation.errors.map(x=>esc(x.key+': '+x.message)).join(' | '):''}</div><div class="notice warn section-gap">Financial settings পরিবর্তন posted transaction rewrite করে না। Society Start Month আগে নিলে missing historical dues idempotently evaluate হবে।</div><form id="settingsForm" class="section-gap">${sections}<section class="settings-section"><h3>Change Control</h3><div class="field"><label>Change Reason *</label><textarea class="textarea" id="settingsReason" required placeholder="কেন পরিবর্তন করা হচ্ছে লিখুন"></textarea></div></section><div class="settings-sticky-actions"><button type="button" class="btn btn-light" id="settings-reset">Reset Unsaved Changes</button><button type="submit" class="btn btn-primary" id="saveSettingsBtn">Save Settings</button></div></form>`);
  ND.settingsDirty=false;const form=$('#settingsForm');
  form.addEventListener('input',()=>{ND.settingsDirty=true});form.addEventListener('change',()=>{ND.settingsDirty=true});
  $$('.setting-restore').forEach(button=>button.onclick=()=>{const input=$(`.setting-input[data-key="${button.dataset.key}"]`);if(input){input.value=button.dataset.previous;ND.settingsDirty=true;toast('Previous value restored locally. Save to apply.')}});
  $('#settings-reset').onclick=()=>{$$('.setting-input').forEach(input=>{input.value=input.dataset.initial||''});$('#settingsReason').value='';ND.settingsDirty=false;toast('Unsaved changes reset.')};
  form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;const items=$$('.setting-input').map(x=>({key:x.dataset.key,value:x.value})),changed=$$('.setting-input').filter(x=>x.value!==(x.dataset.initial||'')),financialChanged=changed.some(x=>x.dataset.financial==='1');let confirmed=false;if(financialChanged){confirmed=window.confirm('এই পরিবর্তন ভবিষ্যতের নতুন লেনদেনে কার্যকর হবে। পূর্বে সম্পন্ন লেনদেন স্বয়ংক্রিয়ভাবে পরিবর্তিত হবে না।');if(!confirmed)return}const button=$('#saveSettingsBtn');setButtonBusy(button,true,'Saving Settings...');try{const result=await api('saveSettings',items,$('#settingsReason').value,confirmed);ND.settingsDirty=false;toast(result.message||'Settings saved.');const b=await api('apiBootstrap');ND.config=b.config;ND.accounts=b.accounts;applyBrand();await renderSettings()}catch(err){toast(err.message,'error')}finally{setButtonBusy(button,false)}};
}

function openPasswordModal(force=false){modal('পাসওয়ার্ড পরিবর্তন',`<form id="passForm"><div class="field"><label>বর্তমান পাসওয়ার্ড</label><input class="input" name="current" type="password" required></div><div class="field"><label>নতুন পাসওয়ার্ড</label><input class="input" name="next" type="password" minlength="8" required></div><div class="field"><label>নতুন পাসওয়ার্ড আবার লিখুন</label><input class="input" name="confirm" type="password" minlength="8" required></div></form>${force?'<div class="notice warn">Security-এর জন্য প্রথম লগইনে Password পরিবর্তন করা আবশ্যক।</div>':''}`,`${force?'':'<button class="btn btn-light" onclick="closeModal()">বাতিল</button>'}<button class="btn btn-primary" id="changePassBtn">Change Password</button>`);if(force){const bd=$('.modal-backdrop');if(bd)bd.onclick=()=>{};const x=$('.modal-close');if(x)x.style.display='none';}$('#changePassBtn').onclick=async()=>{const f=$('#passForm');if(!f.reportValidity())return;const p=formObj(f);if(p.next!==p.confirm){toast('নতুন Password মিলছে না।','error');return}try{await api('changeMyPassword',p.current,p.next);closeModal();toast('Password পরিবর্তন হয়েছে।')}catch(e){toast(e.message,'error')}}}

async function renderReports(){
  const {members,investments,sources}=await api('getReportFilterOptions');
  setContent(`<div class="page-head"><div><h2>রিপোর্টসমূহ</h2><p>Date, month, year, investment, member, profit source, category এবং status filter</p></div><div class="actions"><button class="btn btn-outline btn-sm" id="exportReport">CSV Export</button><button class="btn btn-light btn-sm" onclick="window.print()">Print</button></div></div><div class="card"><div class="card-body"><div class="toolbar"><select class="select" id="reportType"><option>MEMBERS</option><option>DUES</option><option>TRANSACTIONS</option><option>RECEIPTS</option><option>VOUCHERS</option><option>LOANS</option><option>LOAN_SCHEDULE</option><option>GUARANTORS</option><option>INVESTMENTS</option><option>INVESTMENT_RETURNS</option><option>INVESTMENT_CLOSURES</option><option>PROFIT_SOURCES</option><option>PROFIT_RECORDS</option><option>PROFIT_DISTRIBUTIONS</option><option>PROFIT_DISTRIBUTION</option><option>INCOME</option><option>EXPENSES</option><option>BANK_ACCOUNTS</option><option>GENERAL_LEDGER</option><option>MEETINGS</option><option>MEETING_ATTENDANCE</option><option>COMMITTEE</option></select><input class="input" id="reportFrom" type="date" title="From"><input class="input" id="reportTo" type="date" title="To"><input class="input" id="reportMonth" type="month" title="Month"><input class="input" id="reportYear" type="number" min="2000" max="2200" placeholder="Year"><select class="select" id="reportInvestment"><option value="">All Investments</option>${investments.map(i=>`<option value="${i.INVESTMENT_ID}">${esc(i.INVESTMENT_ID)} — ${esc(i.NAME)}</option>`).join('')}</select><select class="select" id="reportMember"><option value="">All Members</option>${members.map(m=>`<option value="${m.memberId}">${esc(m.memberId)} — ${esc(m.nameBn||m.nameEn)}</option>`).join('')}</select><select class="select" id="reportSource"><option value="">All Profit Sources</option>${sources.map(s=>`<option value="${s.SOURCE_ID}">${esc(s.SOURCE_NAME)}</option>`).join('')}</select><select class="select" id="reportCategory"><option value="">All Categories</option>${[...new Set(sources.map(s=>s.CATEGORY).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join('')}<option>SAVINGS</option><option>LOAN</option><option>INCOME</option><option>EXPENSE</option></select><input class="input" id="reportStatus" placeholder="Status (e.g. ACTIVE)"><button class="btn btn-primary btn-sm" id="runReport">Run Report</button><button class="btn btn-light btn-sm" id="clearReport">Clear</button></div><div id="reportSummary" class="helper section-gap"></div><div id="reportResult"><div class="empty">রিপোর্ট নির্বাচন করে Run Report চাপুন।</div></div></div></div>`);
  $('#reportType').insertAdjacentHTML('beforeend','<option>EXPENSE_ALLOCATIONS</option>');
  let last=[];const filters=()=>({from:$('#reportFrom').value,to:$('#reportTo').value,month:$('#reportMonth').value,year:$('#reportYear').value,investmentId:$('#reportInvestment').value,memberId:$('#reportMember').value,sourceId:$('#reportSource').value,category:$('#reportCategory').value,status:$('#reportStatus').value.trim().toUpperCase()});
  $('#runReport').onclick=async()=>{try{last=await api('getReports',$('#reportType').value,filters());$('#reportSummary').textContent=`${last.length} records · Generated ${new Date().toLocaleString('en-BD')}`;$('#reportResult').innerHTML=genericTable(last)}catch(e){toast(e.message,'error')}};
  $('#clearReport').onclick=()=>{$$('#content input').forEach(x=>x.value='');$$('#content select').forEach(x=>x.selectedIndex=0);last=[];$('#reportSummary').textContent='';$('#reportResult').innerHTML='<div class="empty">Filters cleared.</div>'};
  $('#exportReport').onclick=()=>{if(!last.length){toast('আগে রিপোর্ট Run করুন।','error');return}exportCsv(last,$('#reportType').value+'_'+today()+'.csv')};
}

async function renderAudit(){
  const [audit,tx,members]=await Promise.all([api('getAuditLog',{limit:500}),api('listFinancialTransactions',{limit:500}),api('listMembers',{limit:1000})]);ND.financialTxV110=tx;const canChange=isAdmin()||hasPerm('accounts.edit');
  setContent(`<div class="page-head"><div><h2>অডিট, Transaction Edit ও Reversal</h2><p>Posted transaction সরাসরি delete নয়—financial effect সহ reversal/correction এবং immutable audit history</p></div></div><div class="notice warn">“Reverse” করলে original record history-তে থাকবে, বিপরীত ledger entry তৈরি হবে এবং member/account balance স্বয়ংক্রিয়ভাবে সমন্বয় হবে।</div><div class="card section-gap"><div class="card-head"><h3>Financial Transactions</h3></div><div class="card-body"><div class="toolbar"><input class="input" id="txSearch" placeholder="TXN, member, type, reference"><select class="select" id="txMember"><option value="">All Members</option>${members.map(m=>`<option value="${m.memberId}">${esc(m.memberId)} — ${esc(m.nameBn||m.nameEn)}</option>`).join('')}</select><select class="select" id="txCategory"><option value="">All Categories</option>${[...new Set(tx.map(t=>t.CATEGORY).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><select class="select" id="txStatus"><option value="">All Status</option><option>POSTED</option><option>REVERSED</option><option>CORRECTED</option><option>VOID</option></select><input class="input" id="txFrom" type="date"><input class="input" id="txTo" type="date"><button class="btn btn-primary btn-sm" id="filterTx">Filter</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date / TXN</th><th>Member</th><th>Type / Category</th><th>Description</th><th>Direction</th><th>Amount</th><th>Reference</th><th>Status</th><th>Actions</th></tr></thead><tbody id="financialTxRows">${financialTransactionRows(tx,canChange)}</tbody></table></div></div><div class="card section-gap"><div class="card-head"><h3>Audit Trail</h3><span class="helper">Creator/editor/reverser, timestamp, old/new values and reason</span></div><div class="table-wrap"><table class="table"><thead><tr><th>সময়</th><th>User</th><th>Action</th><th>Entity</th><th>ID</th><th>Reason</th><th>Previous Value</th><th>New Value</th></tr></thead><tbody>${audit.map(a=>`<tr><td>${fmtDate(a.CREATED_AT)}</td><td>${esc(a.USER_ID)}</td><td>${statusBadge(a.ACTION)}</td><td>${esc(a.ENTITY_TYPE)}</td><td>${esc(a.ENTITY_ID)}</td><td>${esc(a.REASON)}</td><td title="${esc(a.OLD_VALUE)}">${esc(String(a.OLD_VALUE||'').slice(0,90))}</td><td title="${esc(a.NEW_VALUE)}">${esc(String(a.NEW_VALUE||'').slice(0,90))}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No audit events.</td></tr>'}</tbody></table></div></div>`);
  $('#filterTx').onclick=async()=>{try{const rows=await api('listFinancialTransactions',{q:$('#txSearch').value,memberId:$('#txMember').value,category:$('#txCategory').value,status:$('#txStatus').value,from:$('#txFrom').value,to:$('#txTo').value,limit:500});ND.financialTxV110=rows;$('#financialTxRows').innerHTML=financialTransactionRows(rows,canChange)}catch(e){toast(e.message,'error')}};
}
function financialTransactionRows(rows,canChange){return rows.map(t=>`<tr><td>${fmtDate(t.TXN_DATE)}<br><b>${esc(t.TXN_ID)}</b></td><td>${esc(t.MEMBER_ID||'-')}</td><td>${esc(t.TYPE)}<br><small>${esc(t.CATEGORY)}</small></td><td>${esc(t.DESCRIPTION)}${t.NOTE_PURPOSE?`<br><small><b>Note/Purpose:</b> ${esc(t.NOTE_PURPOSE)}</small>`:''}</td><td>${esc(t.DIRECTION)}</td><td class="amount">${money(t.AMOUNT)}</td><td>${esc(t.REFERENCE||'-')}</td><td>${statusBadge(t.STATUS)}</td><td><div class="actions"><button class="btn btn-light btn-sm" onclick="openFinancialTransactionDetails('${t.TXN_ID}')">View</button>${canChange&&t.CAN_EDIT?`<button class="btn btn-outline btn-sm" onclick="openFinancialTransactionEdit('${t.TXN_ID}')">Edit</button>`:''}${canChange&&t.CAN_REVERSE?`<button class="btn btn-red btn-sm" onclick="reverseFinancialTransactionUi('${t.TXN_ID}')">Reverse</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No transactions found.</td></tr>'}

async function openFinancialTransactionDetails(id){try{const d=await api('getFinancialTransaction',id),t=d.transaction,alloc=d.expenseAllocations||[];modal('Transaction — '+esc(id),`<div class="info-grid">${info('Date',fmtDate(t.TXN_DATE))}${info('Member',t.MEMBER_ID||'-')}${info('Type',t.TYPE)}${info('Category',t.CATEGORY)}${info('Direction',t.DIRECTION)}${info('Amount',money(t.AMOUNT))}${info('Status',t.STATUS)}${info('Reference',t.REFERENCE||'-')}${info('Note / Purpose',t.NOTE_PURPOSE||'-')}${info('Related ID',t.RELATED_ID||'-')}${info('Created By',t.CREATED_BY)}${info('Updated By',t.UPDATED_BY||'-')}</div>${alloc.length?`<div class="form-section section-gap">Unit-Based Member Allocations</div><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Units</th><th>Percentage</th><th>Amount</th><th>Savings Before</th><th>Savings After</th><th>Status</th></tr></thead><tbody>${alloc.map(a=>`<tr><td>${esc(a.MEMBER_NAME||a.MEMBER_ID)}</td><td>${esc(a.UNIT_QUANTITY)}</td><td>${Number(a.UNIT_PERCENTAGE||0).toFixed(2)}%</td><td>${money(a.AMOUNT)}</td><td>${money(a.SAVINGS_BEFORE)}</td><td>${money(a.SAVINGS_AFTER)}</td><td>${statusBadge(a.STATUS)}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="form-section section-gap">General Ledger</div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Account</th><th>Description</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${d.journal.map(g=>`<tr><td>${fmtDate(g.ENTRY_DATE)}</td><td>${esc(g.ACCOUNT_CODE)} ${esc(g.ACCOUNT_NAME)}</td><td>${esc(g.DESCRIPTION)}</td><td>${money(g.DEBIT||0)}</td><td>${money(g.CREDIT||0)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No journal lines.</td></tr>'}</tbody></table></div>${d.reversals.length?`<div class="notice section-gap"><b>Reversal / corrected transactions:</b> ${d.reversals.map(x=>esc(x.TXN_ID)).join(', ')}</div>`:''}`,`<button class="btn btn-light" onclick="closeModal()">Close</button>`,true)}catch(e){toast(e.message,'error')}}
function openFinancialTransactionEdit(id){const t=(ND.financialTxV110||[]).find(x=>x.TXN_ID===id);if(!t)return;if(t.TYPE==='INCOME'&&t.RELATED_ID){openIncomeModal(t.RELATED_ID);return}if(t.TYPE==='EXPENSE'&&t.RELATED_ID){openExpenseEditModal(t.RELATED_ID);return}modal('Audit-safe Transaction Edit',`<div class="notice warn">Original ${esc(id)} will not be overwritten. The system creates a reversal and a linked corrected transaction so balance and ledger remain consistent.</div><form id="financialEditForm" class="section-gap"><div class="form-grid"><div class="field"><label>Current Amount</label><input class="input" value="${esc(t.AMOUNT)}" readonly></div><div class="field"><label>Correct Amount *</label><input class="input" name="amount" type="number" min="0" step="0.01" value="${esc(t.AMOUNT)}" required></div><div class="field full"><label>Correction Reason *</label><textarea class="textarea" name="reason" required></textarea></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveFinancialEdit">Create Corrected Entry</button>`);$('#saveFinancialEdit').onclick=async()=>{const f=$('#financialEditForm');if(!f.reportValidity())return;try{await api('correctFinancialTransaction',id,formObj(f));closeModal();toast('Transaction corrected; balances and ledger recalculated.');renderAudit()}catch(e){toast(e.message,'error')}}}
async function reverseFinancialTransactionUi(id){if(!window.confirm('Are you sure you want to reverse this transaction? This action will also reverse its effect on the member balance and ledger.'))return;const reason=window.prompt('Reversal reason (required):','Incorrect financial transaction');if(!reason||!reason.trim()){toast('Reversal reason required.','error');return}try{await api('reverseFinancialTransaction',id,reason.trim());toast('Transaction reversed with linked audit and ledger entries.');renderAudit()}catch(e){toast(e.message,'error')}}


// Convenience: CSS class fallback for a purple action button.
const style=document.createElement('style');style.textContent='.btn-purple{background:#6f46b7;color:#fff}';document.head.appendChild(style);


window.ND_MODULE_3_READY=true;
</script>
