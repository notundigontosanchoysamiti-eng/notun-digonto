var ND_CHART_PROMISE=null;
function ndLoadChartJs(){
  if(typeof window.Chart!=='undefined')return Promise.resolve(true);
  if(ND_CHART_PROMISE)return ND_CHART_PROMISE;
  ND_CHART_PROMISE=new Promise(function(resolve){
    var done=false,sc=document.createElement('script'),tm;
    function finish(ok){if(done)return;done=true;if(tm)clearTimeout(tm);resolve(!!ok);}
    sc.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js';
    sc.async=true;sc.defer=true;
    sc.onload=function(){finish(typeof window.Chart!=='undefined');};
    sc.onerror=function(){finish(false);};
    tm=setTimeout(function(){finish(false);},4500);
    (document.head||document.documentElement).appendChild(sc);
  });
  return ND_CHART_PROMISE;
}

function tr(v){const s=String(v??'');return ND.lang==='en'?(ND_EN[s]||s):s}
const ND_BN={};Object.keys(ND_EN).forEach(function(bn){ND_BN[ND_EN[bn]]=bn;});
function applyLanguageToNode(root){
  if(!root)return;const map=ND.lang==='en'?ND_EN:ND_BN;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=walker.nextNode())){const p=n.parentElement;if(!p||['SCRIPT','STYLE'].includes(p.tagName))continue;const raw=n.nodeValue,trim=raw.trim();if(trim&&map[trim])n.nodeValue=raw.replace(trim,map[trim]);}
  root.querySelectorAll?.('[placeholder]').forEach(el=>{if(map[el.placeholder])el.placeholder=map[el.placeholder]});
}

function gs(fn,...args){showLoading(true);return new Promise((resolve,reject)=>{if(typeof google==='undefined'||!google.script||!google.script.run){showLoading(false);reject(new Error('Google Apps Script runtime unavailable.'));return;}let runner=google.script.run.withSuccessHandler(r=>{showLoading(false);resolve(r)}).withFailureHandler(err=>{showLoading(false);const msg=err?.message||String(err);if(msg.includes('AUTH_REQUIRED')||msg.includes('AUTH_EXPIRED')){ndStorageRemove('nd_token');ND.token='';showLogin();toast('Session শেষ হয়েছে। আবার লগইন করুন।','error')}reject(new Error(msg))});runner[fn](...args);})}
const ND_MUTATION_PATTERN=/^(create|update|save|collect|record|approve|reverse|cancel|withdraw|transfer|add|reset|change|upload|apply|disburse|correct|edit|mark|generate)/;const ND_INFLIGHT_MUTATIONS=new Map();
function api(fn,...args){if(!ND_MUTATION_PATTERN.test(String(fn)))return gs(fn,ND.token,...args);let key;try{key=fn+'|'+JSON.stringify(args)}catch(e){key=fn}if(ND_INFLIGHT_MUTATIONS.has(key))return ND_INFLIGHT_MUTATIONS.get(key);const request=gs(fn,ND.token,...args).finally(()=>ND_INFLIGHT_MUTATIONS.delete(key));ND_INFLIGHT_MUTATIONS.set(key,request);return request}

function printDocumentOnly(kind){

function fileToDataUrl(file){return new Promise((res,rej)=>{if(!file)return res('');const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function prepareMemberPhoto(file){
  if(!file)return '';
  if(!file.type||!file.type.startsWith('image/'))throw new Error('প্রোফাইল ছবির জন্য JPG/PNG/WebP image দিন।');
  if(file.size>5*1024*1024)throw new Error('প্রোফাইল ছবির সর্বোচ্চ সাইজ 5 MB।');
  const data=await fileToDataUrl(file);
  try{
    const dim=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve({w:im.naturalWidth,h:im.naturalHeight});im.onerror=reject;im.src=data});
    if(dim.w<400||dim.h<400)toast('ছবিটি ছোট resolution-এর। ভালো ফলাফলের জন্য কমপক্ষে 600×600 px ছবি ব্যবহার করুন।','error');
  }catch(e){}
  return data; // Original bytes are retained; no browser-side compression.
}

}

  try{
    if(!r||!r.token||!r.session||!r.config)throw new Error('Login response অসম্পূর্ণ।');
    ND.token=r.token;ND.session=r.session;ND.config=r.config;ND.accounts=r.accounts||[];ND.dashboard=null;ND.membersCache=null;
    ndStorageSet('nd_token',ND.token);
    ND.lang=ndStorageGet('nd_lang')||ND.config.language||'bn';syncLanguageButtons();
    showApp();applyBrand();buildNav();
    setContent('<div class="card"><div class="card-body"><div class="notice"><b>লগইন সফল হয়েছে। ড্যাশবোর্ড লোড হচ্ছে...</b></div></div></div>');
    var ok=await renderPage('dashboard');
    loadNotificationBadge();ndLoadChartJs();
    if(ok&&r.mustChangePassword)setTimeout(function(){openPasswordModal(true)},250);
    return true;
  }catch(err){showAppError(err,'LOGIN_START');throw err;}
}
window.ND_START_APP=ndStartAppFromLogin;
function ndBoot(){
  if(ND_BOOTED)return;ND_BOOTED=true;
  try{
    document.querySelectorAll('#loginLogo,#sideLogo').forEach(function(x){if(!x.getAttribute('src'))x.src=ND_LOGO_DATA});
    if($('#userAvatar')&&!$('#userAvatar').getAttribute('src'))$('#userAvatar').src=ND_LOGO_DATA;
    bindBase();
    if(ND.token){showApp();setContent('<div class="card"><div class="card-body"><div class="notice"><b>আগের Session যাচাই করা হচ্ছে...</b></div></div></div>');initApp().catch(function(err){ndStorageRemove('nd_token');ND.token='';ND.session=null;showLogin();var st=$('#loginStatus');if(st){st.style.display='block';st.style.color='#b42318';st.textContent='আগের Session পাওয়া যায়নি। আবার লগইন করুন।';}console.error(err);});}
    else showLogin();
  }catch(err){showAppError(err,'BOOT');}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ndBoot,{once:true});else setTimeout(ndBoot,0);
window.addEventListener('load',ndBoot,{once:true});
function bindBase(){
  var lo=$('#logoutBtn');if(lo)lo.addEventListener('click',async function(){try{await api('logout')}catch(e){}ndStorageRemove('nd_token');ND.token='';ND.session=null;showLogin()});
  var mt=$('#menuToggle');if(mt)mt.addEventListener('click',toggleSidebarMode);
  var bn=$('#langBnBtn'),en=$('#langEnBtn');if(bn)bn.addEventListener('click',function(){setLanguage('bn')});if(en)en.addEventListener('click',function(){setLanguage('en')});syncLanguageButtons();
  var nb=$('#notificationBtn');if(nb)nb.addEventListener('click',function(){renderPage('notifications')});
  setInterval(updateClock,1000);updateClock();
}
window.addEventListener('beforeunload',function(e){if(!ND.settingsDirty)return;e.preventDefault();e.returnValue='';});
const ndRunDebouncedSearch=ndDebounce(function(id){var button=id==='memberSearch'?$('#memberFilterBtn'):id==='receiptSearch'?$('#receiptSearchBtn'):id==='txSearch'?$('#filterTx'):null;if(button&&!button.disabled)button.click()},400);
document.addEventListener('input',function(e){if(e.target&&['memberSearch','receiptSearch','txSearch'].includes(e.target.id))ndRunDebouncedSearch(e.target.id)});
function showLogin(){destroyCharts();var av=$('#appView'),lv=$('#loginView');if(av)av.classList.add('hidden');if(lv)lv.classList.remove('hidden');var pw=$('#loginPassword');if(pw)pw.value='';var btn=$('#loginBtn');if(btn){btn.disabled=false;btn.textContent='🔐 লগইন';}}
function showApp(){var lv=$('#loginView'),av=$('#appView');if(lv)lv.classList.add('hidden');if(av)av.classList.remove('hidden')}
function applySidebarPreference(){const sb=$('#sidebar');if(!sb)return;if(innerWidth>=980){sb.classList.remove('open');sb.classList.toggle('collapsed',ndStorageGet('nd_sidebar_collapsed')==='1')}else sb.classList.remove('collapsed')}
function toggleSidebarMode(){const sb=$('#sidebar');if(innerWidth<980){sb.classList.toggle('open');return;}sb.classList.toggle('collapsed');ndStorageSet('nd_sidebar_collapsed',sb.classList.contains('collapsed')?'1':'0')}
window.addEventListener('resize',()=>applySidebarPreference());

async function initApp(){
  try{
    const b=await api('apiBootstrap');
    if(!b||!b.session||!b.config)throw new Error('Bootstrap response অসম্পূর্ণ।');
    ND.session=b.session;ND.config=b.config;ND.accounts=b.accounts||[];ND.dashboard=b.dashboard||null;ND.membersCache=null;ND.lang=ndStorageGet('nd_lang')||ND.config.language||'bn';syncLanguageButtons();
    applyBrand();buildNav();showApp();
    await renderPage('dashboard');
    loadNotificationBadge();
    ndLoadChartJs();
    return true;
  }catch(err){
    if(String(ndErrorText(err)).includes('AUTH_')){ndStorageRemove('nd_token');ND.token='';showLogin();throw err}
    showAppError(err,'INIT_APP');throw err;
  }
}
function applyBrand(){
  applySidebarPreference();
  const en=ND.lang==='en';$('#sideName').textContent=en?ND.config.nameEn:ND.config.nameBn;$('#sideNameEn').textContent=en?ND.config.nameBn:ND.config.nameEn;$('#sideEstd').textContent=ND.config.estd;$('#topTitle').textContent=en?ND.config.nameEn:ND.config.nameBn;$('#topTagline').textContent=en?'A reliable savings and loan management solution':(ND.config.tagline||'একটি নির্ভরযোগ্য সঞ্চয় ও ঋণ ব্যবস্থাপনা সমাধান');$('#userName').textContent=ND.session.fullName||ND.session.username;const rolesBn={ADMIN:'প্রশাসক',STAFF:'স্টাফ',ACCOUNTANT:'হিসাবরক্ষক',COLLECTOR:'কালেক্টর',SECRETARY:'সচিব',VIEWER:'ভিউয়ার',MEMBER:'সদস্য'},rolesEn={ADMIN:'Administrator',STAFF:'Staff',ACCOUNTANT:'Accountant',COLLECTOR:'Collector',SECRETARY:'Secretary',VIEWER:'Viewer',MEMBER:'Member'};$('#userRole').textContent=(en?rolesEn:rolesBn)[ND.session.role]||ND.session.role;syncLanguageButtons();
}
function updateClock(){const d=new Date();$('#clockText').textContent=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#dateText').textContent=d.toLocaleDateString(ND.lang==='en'?'en-GB':'bn-BD',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function buildNav(){const admin=[
  ['dashboard','🏠','ড্যাশবোর্ড','Dashboard','dashboard.view'],['members','👥','সদস্য ব্যবস্থাপনা','Members','members.view'],['savings','💰','সঞ্চয় ও কালেকশন','Savings','savings.view'],['receipts','🧾','রিসিট ও ভাউচার','Receipts','receipts.view'],['loans','🏦','লোন ব্যবস্থাপনা','Loans','loans.view'],['investments','📈','বিনিয়োগ','Investments','investments.view'],['profits','🪙','মুনাফা ব্যবস্থাপনা','Profit Management','profits.view'],['finance','💼','হিসাব ও ফাইন্যান্স','Accounts & Finance','accounts.view'],['meetings','🤝','সভা ও কমিটি','Meetings & Committee','meetings.view'],['documents','📁','ডকুমেন্টস','Documents','documents.view'],['reports','📊','রিপোর্টসমূহ','Reports','reports.view'],['notifications','🔔','নোটিফিকেশন','Notifications','dashboard.view'],['users','👤','ব্যবহারকারী ও পারমিশন','Users & Roles','users.view'],['audit','🛡️','অডিট ও সংশোধন','Audit & Corrections','audit.view'],['backup','💾','ব্যাকআপ ও ডাটাবেজ','Backup & Database','backup.manage'],['settings','⚙️','সেটিংস','Settings','settings.edit']
  ];
  const member=[['dashboard','🏠','ড্যাশবোর্ড','Dashboard'],['profile','👤','আমার প্রোফাইল','My Profile'],['savings','💰','আমার সঞ্চয়','My Savings'],['ledger','📒','আমার লেজার','My Ledger'],['loans','🏦','আমার ঋণ','My Loans'],['receipts','🧾','আমার রিসিট','My Receipts'],['documents','📁','আমার ডকুমেন্ট','Documents'],['notifications','🔔','নোটিশ','Notices'],['password','🔐','পাসওয়ার্ড','Change Password']];
  let items=isMember()?member:admin.filter(x=>x[0]==='users'?isAdmin():(x[0]==='settings'?isAdmin():(x[0]==='audit'||x[0]==='backup'?isAdmin()||hasPerm(x[4]):hasPerm(x[4]))));
  $('#nav').innerHTML=items.map(x=>`<a class="nav-item" data-page="${x[0]}"><span class="nav-icon">${x[1]}</span><span class="nav-label"><b>${ND.lang==='en'?x[3]:x[2]}</b><small>${ND.lang==='en'?x[2]:x[3]}</small></span></a>`).join('')+`<a class="nav-item" id="sideLogout"><span class="nav-icon">↪</span><span class="nav-label"><b>${ND.lang==='en'?'Logout':'লগ আউট'}</b><small>${ND.lang==='en'?'লগ আউট':'Logout'}</small></span></a>`;
  $$('#nav .nav-item[data-page]').forEach(a=>a.onclick=()=>renderPage(a.dataset.page));$('#sideLogout').onclick=()=>$('#logoutBtn').click();
}
function setActiveNav(page){$$('#nav .nav-item').forEach(a=>a.classList.toggle('active',a.dataset.page===page));if(innerWidth<980)$('#sidebar').classList.remove('open')}
async function renderPage(page){
  if(ND.currentPage==='settings'&&ND.settingsDirty&&page!=='settings'&&!window.confirm('সেটিংসে সংরক্ষণ না করা পরিবর্তন আছে। পেজ পরিবর্তন করলে সেগুলো হারাবে।'))return false;
  if(page!=='settings')ND.settingsDirty=false;ND.currentPage=page;setActiveNav(page);destroyCharts();
  try{
    if(page==='dashboard')await renderDashboard();
    else if(page==='members')await renderMembers();
    else if(page==='profile')await renderMemberProfile(ND.session.memberId);
    else if(page==='savings')await renderSavings();
    else if(page==='ledger')await renderLedger(ND.session.memberId);
    else if(page==='receipts')await renderReceipts();
    else if(page==='loans')await renderLoans();
    else if(page==='investments')await renderInvestments();
    else if(page==='profits')await renderProfitManagement();
    else if(page==='finance')await renderFinance();
    else if(page==='meetings')await renderMeetings();
    else if(page==='documents')await renderDocuments();
    else if(page==='reports')await renderReports();
    else if(page==='notifications')await renderNotifications();
    else if(page==='users')await renderUsers();
    else if(page==='audit')await renderAudit();
    else if(page==='backup')await renderBackup();
    else if(page==='settings')await renderSettings();
    else if(page==='password')openPasswordModal(false);
    else setContent(`<div class="empty">Page not found.</div>`);
    return true;
  }catch(e){
    console.error('[ND renderPage]',page,e);toast(ndErrorText(e),'error');
    setContent(`<div class="card"><div class="card-body"><div class="notice danger"><b>${esc(page)} page লোড হয়নি</b><br>${esc(ndErrorText(e))}</div><div class="section-gap"><button class="btn btn-primary" onclick="renderPage('${page}')">আবার চেষ্টা করুন</button></div></div></div>`);
    return false;
  }
}
async function ensureMembersCache(){if(ND.membersCache)return ND.membersCache;const rows=await api('listMembers',{limit:500});ND.membersCache=rows;return rows}
async function memberName(id){const rows=await ensureMembersCache();return rows.find(x=>x.memberId===id)?.nameBn||id||'-'}
async function loadNotificationBadge(){try{const n=await api('listNotifications');const c=n.filter(x=>x.STATUS==='UNREAD').length;$('#notificationBadge').textContent=c;$('#notificationBadge').classList.toggle('hidden',!c)}catch(e){}}

function ndModuleHealth(){return {core:!!window.ND_APP_CORE_READY,module1:!!window.ND_MODULE_1_READY,module2:!!window.ND_MODULE_2_READY,module3:!!window.ND_MODULE_3_READY,build:window.ND_BUILD_ID||''};}
window.ND_APP_CORE_READY=true;
</script>
