<script id="ndModule2">
async function renderLoans(){const rows=await api('listLoans',{});setContent(`<div class="page-head"><div><h2>${isMember()?'আমার ঋণ':'লোন ব্যবস্থাপনা'}</h2><p>Application, Eligibility, Approval, Guarantor, EMI ও Collection</p></div><div class="actions">${isMember()||isAdmin()||hasPerm('loans.create')?`<button class="btn btn-gold btn-sm" onclick="openLoanApplyModal()">＋ নতুন ঋণ আবেদন</button>`:''}${!isMember()&&(hasPerm('loans.payment')||hasPerm('accounts.edit')||isAdmin())?`<button class="btn btn-green btn-sm" onclick="openLoanPaymentModal()">＋ কিস্তি আদায়</button>`:''}</div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Loan ID</th><th>Member</th><th>Apply Date</th><th>Requested</th><th>Approved</th><th>Outstanding</th><th>Approval</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(l=>`<tr><td><b>${esc(l.LOAN_ID)}</b></td><td>${esc(l.MEMBER_NAME||l.MEMBER_ID)}</td><td>${fmtDate(l.APPLICATION_DATE)}</td><td>${money(l.REQUESTED_AMOUNT)}</td><td>${money(l.APPROVED_AMOUNT)}</td><td>${money(l.OUTSTANDING_PRINCIPAL)}</td><td>${statusBadge(l.APPROVAL_STATUS)}</td><td>${statusBadge(l.STATUS)}</td><td><button class="btn btn-light btn-sm" onclick="openLoanDetails('${l.LOAN_ID}')">Details</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">কোনো ঋণ আবেদন নেই।</td></tr>'}</tbody></table></div></div>`)}
async function openLoanApplyModal(){const members=isMember()?[]:await ensureMembersCache();modal('নতুন ঋণ আবেদন',`<form id="loanApplyForm"><div class="form-grid">${isMember()?'':`<div class="field full"><label>সদস্য *</label><select class="select" name="memberId" id="loanMember" required><option value="">নির্বাচন করুন</option>${members.filter(m=>m.status==='ACTIVE').map(m=>`<option value="${m.memberId}">${esc(m.memberId)} — ${esc(m.nameBn||m.nameEn)}</option>`).join('')}</select></div>`}<div class="field"><label>Loan Type</label><select class="select" name="loanType" id="loanType"><option value="GENERAL">General Loan</option><option value="SECURED">Savings Secured</option><option value="EMERGENCY">Emergency</option><option value="BUSINESS">Business</option></select></div><div class="field"><label>Requested Amount *</label><input class="input" name="amount" type="number" min="1" required></div><div class="field"><label>Term (Months)</label><input class="input" name="termMonths" type="number" min="1" max="60" value="12"></div><div class="field"><label>Method</label><select class="select" name="method"><option value="REDUCING">Reducing Balance</option><option value="FLAT">Flat</option></select></div><div class="field full"><label>Purpose</label><textarea class="textarea" name="purpose"></textarea></div><div class="field"><label>Guarantor Member ID 1</label><input class="input" name="guarantor1" placeholder="NDS-2026-0001"></div><div class="field"><label>Guarantor Member ID 2</label><input class="input" name="guarantor2" placeholder="NDS-2026-0002"></div><div class="field full"><button type="button" class="btn btn-outline btn-sm" id="checkElig">Eligibility Check</button><div id="eligBox" class="section-gap"></div></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-gold" id="submitLoan">Submit Application</button>`);$('#checkElig').onclick=async()=>{const f=formObj($('#loanApplyForm')),mid=isMember()?ND.session.memberId:f.memberId;if(!mid){toast('সদস্য নির্বাচন করুন।','error');return}try{const e=await api('getLoanEligibility',mid,f.loanType);$('#eligBox').innerHTML=`<div class="notice ${e.eligible?'':'warn'}"><b>${e.eligible?'Eligible':'Not eligible'}</b><br>সঞ্চয়: ${money(e.savings)} · বকেয়া: ${money(e.due)} · Existing Loan: ${money(e.existingLoan)} · Eligible Limit: <b>${money(e.eligibleLimit)}</b>${e.reasons.length?'<br>'+e.reasons.map(esc).join(' | '):''}</div>`}catch(err){toast(err.message,'error')}};$('#submitLoan').onclick=async()=>{const f=$('#loanApplyForm');if(!f.reportValidity())return;const p=formObj(f);p.guarantors=[p.guarantor1,p.guarantor2].filter(Boolean);try{const r=await api('applyLoan',p);closeModal();toast('ঋণ আবেদন তৈরি হয়েছে: '+r.loanId);renderLoans()}catch(e){toast(e.message,'error')}}}
async function openLoanDetails(id){const d=await api('getLoanDetails',id),l=d.loan;let buttons=`<button class="btn btn-light" onclick="closeModal()">বন্ধ</button>`;if(!isMember()&&l.APPROVAL_STATUS==='PENDING'&&(isAdmin()||hasPerm('loans.approve')))buttons+=`<button class="btn btn-red" onclick="decideLoan('${id}',false)">Reject</button><button class="btn btn-green" onclick="openApproveLoan('${id}',${Number(l.REQUESTED_AMOUNT)})">Approve</button>`;if(!isMember()&&l.STATUS==='APPROVED'&&(isAdmin()||hasPerm('loans.approve')||hasPerm('accounts.edit')))buttons+=`<button class="btn btn-primary" onclick="openDisburseLoan('${id}')">Disburse</button>`;if(!isMember()&&['ACTIVE','OVERDUE'].includes(l.STATUS)&&(isAdmin()||hasPerm('loans.payment')||hasPerm('accounts.edit')))buttons+=`<button class="btn btn-green" onclick="closeModal();openLoanPaymentModal('${id}')">Collect Installment</button>`;modal('Loan Details — '+esc(id),`<div class="info-grid">${info('Member ID',l.MEMBER_ID)}${info('Loan Type',l.LOAN_TYPE)}${info('Requested',money(l.REQUESTED_AMOUNT))}${info('Approved',money(l.APPROVED_AMOUNT))}${info('Annual Rate',l.ANNUAL_RATE+'%')}${info('Method',l.METHOD)}${info('Term',l.TERM_MONTHS+' months')}${info('Outstanding',money(l.OUTSTANDING_PRINCIPAL))}${info('Next Due',fmtDate(l.NEXT_DUE_DATE))}${info('Status',l.STATUS)}${info('Purpose',l.PURPOSE)}</div><div class="form-section section-gap">Installment Schedule</div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Due Date</th><th>Opening</th><th>Principal</th><th>Profit</th><th>Total</th><th>Paid</th><th>Status</th></tr></thead><tbody>${d.schedule.map(s=>`<tr><td>${s.INSTALLMENT_NO}</td><td>${fmtDate(s.DUE_DATE)}</td><td>${money(s.OPENING_PRINCIPAL)}</td><td>${money(s.PRINCIPAL_DUE)}</td><td>${money(s.PROFIT_DUE)}</td><td>${money(s.TOTAL_DUE)}</td><td>${money(Number(s.PRINCIPAL_PAID)+Number(s.PROFIT_PAID)+Number(s.PENALTY_PAID))}</td><td>${statusBadge(s.STATUS)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Disbursement-এর পর schedule তৈরি হবে।</td></tr>'}</tbody></table></div><div class="form-section section-gap">Payments</div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Payment ID</th><th>Amount</th><th>Principal</th><th>Profit</th><th>Receipt</th></tr></thead><tbody>${d.payments.map(p=>`<tr><td>${fmtDate(p.PAYMENT_DATE)}</td><td>${esc(p.PAYMENT_ID)}</td><td>${money(p.AMOUNT)}</td><td>${money(p.PRINCIPAL_AMOUNT)}</td><td>${money(p.PROFIT_AMOUNT)}</td><td><button class="btn btn-light btn-sm" onclick="printReceipt('${p.RECEIPT_ID}')">Print</button></td></tr>`).join('')}</tbody></table></div>`,buttons,true)}
function openApproveLoan(id,amount){modal('Loan Approval',`<form id="approveLoanForm"><div class="form-grid"><div class="field"><label>Approved Amount</label><input class="input" name="approvedAmount" type="number" value="${amount}" required></div><div class="field"><label>Annual Rate (%)</label><input class="input" name="annualRate" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Term (Months)</label><input class="input" name="termMonths" type="number" value="12"></div><div class="field"><label>Method</label><select class="select" name="method"><option>REDUCING</option><option>FLAT</option></select></div><div class="field full"><label>Approval Note</label><textarea class="textarea" name="note"></textarea></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-green" id="doApproveLoan">Approve</button>`);$('#doApproveLoan').onclick=async()=>{try{const p=formObj($('#approveLoanForm'));p.approve=true;await api('approveLoan',id,p);closeModal();toast('ঋণ অনুমোদিত হয়েছে।');renderLoans()}catch(e){toast(e.message,'error')}}}
async function decideLoan(id,approve){try{await api('approveLoan',id,{approve:approve,note:'Rejected by admin'});closeModal();toast('Loan status updated.');renderLoans()}catch(e){toast(e.message,'error')}}
function openDisburseLoan(id){modal('Loan Disbursement',`<form id="disburseForm"><div class="form-grid"><div class="field"><label>Date</label><input class="input" type="date" name="date" value="${today()}"></div><div class="field"><label>Payment Account</label><select class="select" name="accountId">${ND.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Reference</label><input class="input" name="reference"></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-primary" id="doDisburse">Disburse</button>`);$('#doDisburse').onclick=async()=>{try{await api('disburseLoan',id,formObj($('#disburseForm')));closeModal();toast('ঋণ বিতরণ সম্পন্ন।');renderLoans()}catch(e){toast(e.message,'error')}}}
async function openLoanPaymentModal(loanId=''){const loans=await api('listLoans',{});const active=loans.filter(l=>['ACTIVE','OVERDUE'].includes(l.STATUS));modal('ঋণ কিস্তি আদায়',`<form id="loanPayForm"><div class="form-grid"><div class="field full"><label>Loan *</label><select class="select" name="loanId" required><option value="">নির্বাচন করুন</option>${active.map(l=>`<option value="${l.LOAN_ID}" ${l.LOAN_ID===loanId?'selected':''}>${esc(l.LOAN_ID)} — ${esc(l.MEMBER_NAME||l.MEMBER_ID)} — বাকি ${money(l.OUTSTANDING_PRINCIPAL)}</option>`).join('')}</select></div><div class="field"><label>Amount *</label><input class="input" name="amount" type="number" min="1" step="0.01" required></div><div class="field"><label>Date</label><input class="input" name="date" type="date" value="${today()}"></div><div class="field"><label>Account</label><select class="select" name="accountId">${ND.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Reference</label><input class="input" name="reference"></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-green" id="saveLoanPay">Save & Receipt</button>`);$('#saveLoanPay').onclick=async()=>{const f=$('#loanPayForm');if(!f.reportValidity())return;try{const r=await api('collectLoanPayment',formObj(f));closeModal();toast('কিস্তি জমা হয়েছে: '+r.receiptId);printReceipt(r.receiptId)}catch(e){toast(e.message,'error')}}}

async function renderFinance(){
  const d=await api('getFinancePage');ND.financeV115=d;const canChange=isAdmin()||hasPerm('accounts.edit');
  const incomeRows=d.income.slice(0,30).map(r=>`<tr><td>${fmtDate(r.DATE)}<br><small>${esc(r.INCOME_ID)}</small></td><td>${r.INCOME_TYPE==='DISTRIBUTABLE_PROFIT'?'<span class="status active">Distributable Profit</span>':'<span class="status posted">General Income</span>'}<br><small>${esc(r.CATEGORY)}</small></td><td>${esc(r.DESCRIPTION)}${r.NOTE?`<br><small>${esc(r.NOTE)}</small>`:''}${r.PROFIT_ID?`<br><small>Profit: ${esc(r.PROFIT_ID)} · Remaining ${money(r.UNDISTRIBUTED_AMOUNT)}</small>`:''}</td><td class="amount">${money(r.AMOUNT)}</td><td>${statusBadge(r.STATUS)}</td><td><div class="actions"><button class="btn btn-light btn-sm" onclick="openIncomeDetails('${r.INCOME_ID}')">View</button>${canChange&&r.STATUS==='POSTED'?`<button class="btn btn-outline btn-sm" onclick="openIncomeModal('${r.INCOME_ID}')">Edit</button><button class="btn btn-red btn-sm" onclick="reverseIncomeUi('${r.INCOME_ID}')">Delete / Reverse</button>`:''}${r.VOUCHER_ID?`<button class="btn btn-primary btn-sm" onclick="printVoucher('${r.VOUCHER_ID}')">Print</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">কোনো আয় নেই।</td></tr>';
  const expenseRows=d.expenses.slice(0,30).map(r=>`<tr><td>${fmtDate(r.DATE)}<br><small>${esc(r.EXPENSE_ID)}</small></td><td>${esc(r.CATEGORY)}${r.ALLOCATION_METHOD==='UNIT_BASED'?'<br><span class="status active">Unit-Based</span>':'<br><small>Normal Expense</small>'}</td><td>${esc(r.DESCRIPTION)}</td><td class="amount">${money(r.AMOUNT)}</td><td>${statusBadge(r.STATUS)}</td><td><div class="actions"><button class="btn btn-light btn-sm" onclick="openExpenseDetailsUi('${r.EXPENSE_ID}')">View</button>${canChange&&r.STATUS==='POSTED'?`<button class="btn btn-outline btn-sm" onclick="openExpenseEditModal('${r.EXPENSE_ID}')">Edit</button><button class="btn btn-red btn-sm" onclick="reverseExpenseUi('${r.EXPENSE_ID}')">Delete / Reverse</button>`:''}${r.VOUCHER_ID?`<button class="btn btn-primary btn-sm" onclick="printVoucher('${r.VOUCHER_ID}')">Print</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">কোনো ব্যয় নেই।</td></tr>';
  setContent(`<div class="page-head"><div><h2>হিসাব ও ফাইন্যান্স</h2><p>Cash/Bank, General Income, Distributable Profit, Expense, Ledger ও Profit/Loss</p></div><div class="actions">${canChange?`<button class="btn btn-green btn-sm" onclick="openIncomeModal()">＋ আয়</button><button class="btn btn-red btn-sm" onclick="openExpenseModal()">＋ ব্যয়</button><button class="btn btn-outline btn-sm" onclick="openTransferModal()">⇄ Transfer</button><button class="btn btn-outline btn-sm" onclick="openWithdrawalModal()">💸 Withdrawal</button>`:''}</div></div><div class="kpi-grid">${d.accounts.slice(0,6).map(a=>kpi(a.type==='CASH'?'💵':a.type==='MFS'?'📱':'🏦',a.name,money(a.balance),a.type,a.balance<0?'red':'blue')).join('')}</div><div class="kpi-grid section-gap">${kpi('📈','মোট আয়',money(d.profitLoss.income),'General Ledger Income','green')}${kpi('📉','মোট ব্যয়',money(d.profitLoss.expense),'General Ledger Expense','red')}${kpi('✅','নিট ফলাফল',money(d.profitLoss.net),'Income - Expense',d.profitLoss.net>=0?'green':'red')}</div><div class="card section-gap"><div class="card-head"><h3>আয়</h3><span class="helper">General Income সমিতির তহবিলে থাকবে; Distributable Profit সদস্যদের বণ্টনের জন্য Profit Management-এ যাবে।</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Date / ID</th><th>Income Type</th><th>Description / Profit Link</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${incomeRows}</tbody></table></div></div><div class="card section-gap"><div class="card-head"><h3>ব্যয়</h3><span class="helper">Financial delete সবসময় audit-safe reversal হিসেবে সম্পন্ন হবে।</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Date / ID</th><th>Category / Method</th><th>Description</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${expenseRows}</tbody></table></div></div><div class="card section-gap"><div class="card-head"><h3>General Ledger</h3><div class="actions"><button class="btn btn-light btn-sm" onclick="renderLedger()">Member Ledger</button>${isAdmin()?`<button class="btn btn-outline btn-sm" onclick="openBankAccountModal()">＋ Account</button><button class="btn btn-outline btn-sm" onclick="openProfitDistributionModal()">Profit Distribution</button>`:''}</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Entry</th><th>Account</th><th>Description</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${d.ledger.map(r=>`<tr><td>${fmtDate(r.ENTRY_DATE)}</td><td>${esc(r.ENTRY_ID)}</td><td>${esc(r.ACCOUNT_CODE)} ${esc(r.ACCOUNT_NAME)}</td><td>${esc(r.DESCRIPTION)}</td><td class="amount">${Number(r.DEBIT)?money(r.DEBIT):'-'}</td><td class="amount">${Number(r.CREDIT)?money(r.CREDIT):'-'}</td></tr>`).join('')}</tbody></table></div></div>`);
}

async function openIncomeModal(id=''){
  try{
    const [opts,details]=await Promise.all([api('getIncomeFormOptions'),id?api('getIncomeDetails',id):Promise.resolve(null)]),row=details?.income||{},profit=details?.profit||{},type=row.INCOME_TYPE||'GENERAL',requestId='INC-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10),sources=opts.sources||[],investments=opts.investments||[];
    modal(id?'আয় সম্পাদনা করুন':'নতুন আয় যোগ করুন',`<div class="notice">General Income শুধু সমিতির তহবিলে থাকবে। Distributable Profit নির্বাচন করলে একই financial transaction-এর সঙ্গে একটি linked undistributed Profit Record তৈরি হবে; Cash/Bank দ্বিতীয়বার বাড়বে না।</div>${id&&details.distributions?.some(x=>['DRAFT','PROCESSING','APPROVED'].includes(x.STATUS))?'<div class="notice warn section-gap">এই আয়ের সঙ্গে Profit Distribution যুক্ত আছে। Source, Investment, Date বা Period পরিবর্তনের আগে Distribution cancel/reverse করতে হবে; Amount distributed/reserved total-এর নিচে নামানো যাবে না।</div>':''}<form id="incomeForm" class="section-gap"><input type="hidden" name="clientRequestId" value="${esc(requestId)}"><div class="form-grid"><div class="field full"><label>Income Type *</label><select class="select" name="incomeType" id="incomeType" required><option value="GENERAL" ${type==='GENERAL'?'selected':''}>General Income</option><option value="DISTRIBUTABLE_PROFIT" ${type==='DISTRIBUTABLE_PROFIT'?'selected':''}>Distributable Profit</option></select><div class="helper" id="incomeTypeHelp"></div></div><div class="field"><label>Income Date *</label><input class="input" name="date" type="date" value="${esc(row.DATE||today())}" required></div><div class="field"><label>Amount *</label><input class="input" name="amount" type="number" min="0.01" step="0.01" value="${esc(row.AMOUNT||'')}" required></div><div class="field"><label>Income Category</label><select class="select" name="category">${['OTHER','MEMBERSHIP_FEE','LATE_FEE','INVESTMENT_INCOME'].map(x=>`<option ${row.CATEGORY===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Cash / Bank Account *</label><select class="select" name="accountId" required>${ndAccountOptions_(row.ACCOUNT_ID||'')}</select></div><div class="field full income-profit-field"><label>Profit Source *</label><select class="select" name="sourceId" id="incomeProfitSource"><option value="">Select Profit Source</option>${sources.map(s=>`<option value="${s.SOURCE_ID}" data-investment="${esc(s.INVESTMENT_ID||'')}" ${profit.SOURCE_ID===s.SOURCE_ID?'selected':''}>${esc(s.SOURCE_NAME)} · ${esc(s.CATEGORY)}</option>`).join('')}</select></div><div class="field income-profit-field"><label>Profit Category</label><select class="select" name="profitCategory">${['LAND','PROPERTY','BUSINESS','AGRICULTURE','PROJECT','OTHER'].map(x=>`<option ${String(profit.CATEGORY||'OTHER')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field income-profit-field"><label>Linked Investment / Project</label><select class="select" name="investmentId" id="incomeInvestment"><option value="">Standalone Profit Source</option>${investments.map(i=>`<option value="${i.INVESTMENT_ID}" ${profit.INVESTMENT_ID===i.INVESTMENT_ID?'selected':''}>${esc(i.INVESTMENT_ID)} — ${esc(i.NAME)}</option>`).join('')}</select></div><div class="field full income-profit-field"><div class="form-grid">${ndProfitPeriodFields_(profit&&profit.PROFIT_ID?profit:{periodType:'MONTHLY'})}</div></div><div class="field"><label>Reference / Transaction ID</label><input class="input" name="reference" value="${esc(row.REFERENCE||'')}"></div><div class="field"><label>Payee / Income Source Name</label><input class="input" name="payee" value="${esc(details?.voucher?.PAYEE||'')}"></div><div class="field full"><label>Description *</label><textarea class="textarea" name="description" required>${esc(row.DESCRIPTION||'')}</textarea></div><div class="field full"><label>Note</label><textarea class="textarea" name="note" maxlength="2000">${esc(row.NOTE||'')}</textarea></div><div class="field full income-profit-field"><div class="notice success" id="incomeProfitSummary"></div></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-green" id="saveIncome">${id?'Update Income':'Save Income'}</button>`,true);
    ndBindProfitPeriod_();const typeEl=$('#incomeType'),save=$('#saveIncome');let posting=false;const sync=()=>{const distributable=typeEl.value==='DISTRIBUTABLE_PROFIT';$$('#modalRoot .income-profit-field').forEach(x=>x.style.display=distributable?'':'none');$$('#modalRoot .nd-period').forEach(x=>{if(!distributable)x.style.display='none'});if(distributable)ndBindProfitPeriod_();$('#incomeProfitSource').required=distributable;$('#incomeTypeHelp').textContent=distributable?'এই আয় Profit Distribution-এর Undistributed Profit হিসেবে পাওয়া যাবে।':'এই আয় শুধু Cash/Bank ও Income Report-এ থাকবে; সদস্যদের মধ্যে বণ্টিত হবে না।';const summary=$('#incomeProfitSummary');if(summary)summary.innerHTML=distributable?`<b>Distribution Status:</b> Undistributed · একই income transaction হবে accounting source of truth।`:''};typeEl.onchange=sync;sync();
    $('#incomeProfitSource').onchange=()=>{const o=$('#incomeProfitSource').selectedOptions[0],linked=o?.dataset.investment;if(linked)$('#incomeInvestment').value=linked};

function ndFinancialReason_(message){
  if(!window.confirm(message))return '';
  const reason=window.prompt('এই আর্থিক পরিবর্তনের কারণ লিখুন:','Correction approved by administrator');
  return reason&&reason.trim()?reason.trim():'';
}
function ndOpenInvestmentStatus_(status){return ['ACTIVE','PARTIALLY_RETURNED','PRINCIPAL_RETURNED'].includes(String(status||'').toUpperCase())}
function ndAccountOptions_(selected){return (ND.accounts||[]).map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.name)} (${esc(a.type)})</option>`).join('')}
function ndProfitPeriodFields_(v={}){
  const y=v.year||String(v.PERIOD_START||today()).slice(0,4),m=v.month||String(v.PERIOD_START||today()).slice(0,7),pt=v.periodType||v.PERIOD_TYPE||'MONTHLY';
  return `<div class="field"><label>Profit Period</label><select class="select" name="periodType" id="profitPeriodType"><option value="MONTHLY" ${pt==='MONTHLY'?'selected':''}>Monthly</option><option value="QUARTERLY" ${pt==='QUARTERLY'?'selected':''}>Quarterly</option><option value="HALF_YEARLY" ${pt==='HALF_YEARLY'?'selected':''}>Half-Yearly</option><option value="YEARLY" ${pt==='YEARLY'?'selected':''}>Yearly</option><option value="CUSTOM" ${pt==='CUSTOM'?'selected':''}>Custom Date Range</option></select></div>
  <div class="field nd-period nd-period-month"><label>Month</label><input class="input" name="month" type="month" value="${esc(m)}"></div>
  <div class="field nd-period nd-period-year"><label>Year</label><input class="input" name="year" type="number" min="2000" max="2200" value="${esc(y)}"></div>
  <div class="field nd-period nd-period-quarter"><label>Quarter</label><select class="select" name="quarter"><option value="1">Q1</option><option value="2">Q2</option><option value="3">Q3</option><option value="4">Q4</option></select></div>
  <div class="field nd-period nd-period-half"><label>Half</label><select class="select" name="half"><option value="1">H1 (Jan–Jun)</option><option value="2">H2 (Jul–Dec)</option></select></div>
  <div class="field nd-period nd-period-custom"><label>Period Start</label><input class="input" name="periodStart" type="date" value="${esc(v.periodStart||v.PERIOD_START||today())}"></div>
  <div class="field nd-period nd-period-custom"><label>Period End</label><input class="input" name="periodEnd" type="date" value="${esc(v.periodEnd||v.PERIOD_END||today())}"></div>`;
}
function ndBindProfitPeriod_(){
  const el=$('#profitPeriodType');if(!el)return;
  const sync=()=>{const t=el.value;$$('#modalRoot .nd-period').forEach(x=>x.style.display='none');if(t==='MONTHLY')$$('#modalRoot .nd-period-month').forEach(x=>x.style.display='');if(['QUARTERLY','HALF_YEARLY','YEARLY'].includes(t))$$('#modalRoot .nd-period-year').forEach(x=>x.style.display='');if(t==='QUARTERLY')$$('#modalRoot .nd-period-quarter').forEach(x=>x.style.display='');if(t==='HALF_YEARLY')$$('#modalRoot .nd-period-half').forEach(x=>x.style.display='');if(t==='CUSTOM')$$('#modalRoot .nd-period-custom').forEach(x=>x.style.display='')};
  el.onchange=sync;sync();
}

async function openInvestmentCloseModal(id){
  const d=await api('getInvestmentDetails',id),x=d.investment,cost=Number(x.TOTAL_INVESTED||x.AMOUNT||0),returned=Number(x.PRINCIPAL_RETURNED||0);
  modal('Sell / Close Investment',`<div class="notice warn">এই action investment-কে আর Active রাখবে না। Sale value, profit/loss, transaction, ledger এবং linked profit record একসাথে তৈরি হবে। একই investment দ্বিতীয়বার close করা যাবে না।</div><form id="closeInvestmentForm" class="section-gap"><input type="hidden" name="investmentId" value="${esc(id)}"><div class="form-grid"><div class="field"><label>Investment Name</label><input class="input" value="${esc(x.NAME)}" readonly></div><div class="field"><label>Category</label><input class="input" value="${esc(x.TYPE)}" readonly></div><div class="field"><label>Original Principal</label><input class="input" value="${cost?money(x.AMOUNT):'-'}" readonly></div><div class="field"><label>Total Amount Invested</label><input class="input" value="${money(cost)}" readonly></div><div class="field"><label>Principal Already Returned</label><input class="input" value="${money(returned)}" readonly></div><div class="field"><label>Sale / Closing Date *</label><input class="input" name="closeDate" type="date" value="${today()}" required></div><div class="field"><label>Total Selling Amount *</label><input class="input" id="sellingAmount" name="sellingAmount" type="number" min="${returned}" step="0.01" required><small class="helper">Lifetime sale proceeds; must include any principal already returned.</small></div><div class="field"><label>Cash Received Now</label><input class="input" id="closingCash" readonly></div><div class="field"><label>Principal Returned at Settlement</label><input class="input" id="closingPrincipal" readonly></div><div class="field"><label>Profit Generated</label><input class="input" id="closingProfit" readonly></div><div class="field"><label>Loss Generated</label><input class="input" id="closingLoss" readonly></div><div class="field"><label>Account</label><select class="select" name="accountId">${ndAccountOptions_('')}</select></div><div class="field"><label>Closing Status</label><select class="select" name="status"><option value="SOLD_CLOSED">Sold / Closed</option><option value="COMPLETED">Completed</option></select></div><div class="field"><label>Closing Reference / Transaction ID *</label><input class="input" name="reference" required></div><div class="field full"><div class="form-grid">${ndProfitPeriodFields_({periodType:'CUSTOM',periodStart:today(),periodEnd:today()})}</div></div><div class="field full"><label>Notes</label><textarea class="textarea" name="notes"></textarea></div><div class="field full"><label>Reason for closure *</label><textarea class="textarea" name="reason" required>Investment sold/settled</textarea></div></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-gold" id="closeInvestmentBtn">Confirm Sale / Closure</button>`,true);
  ndBindProfitPeriod_();const calc=()=>{const sale=Number($('#sellingAmount').value||0);$('#closingCash').value=money(Math.max(0,sale-returned));$('#closingPrincipal').value=money(Math.min(cost,sale));$('#closingProfit').value=money(Math.max(0,sale-cost));$('#closingLoss').value=money(Math.max(0,cost-sale))};$('#sellingAmount').oninput=calc;calc();
  $('#closeInvestmentBtn').onclick=async()=>{const f=$('#closeInvestmentForm');if(!f.reportValidity())return;if(!window.confirm('Are you sure you want to close this investment? This will post the sale, profit/loss and ledger effects.'))return;try{const r=await api('closeInvestment',formObj(f));closeModal();toast(`Investment closed · Profit ${money(r.profit)} · Loss ${money(r.loss)}`);renderInvestments()}catch(e){toast(e.message,'error')}};
}

async function openInvestmentDetails(id){

  modal('Investment Details — '+esc(id),`<div class="info-grid">${info('Category',x.TYPE)}${info('Name',x.NAME)}${info('Original Principal',money(x.AMOUNT))}${info('Total Invested',money(x.TOTAL_INVESTED||x.AMOUNT))}${info('Principal Returned',money(x.PRINCIPAL_RETURNED||0))}${info('Selling Amount',money(x.SELLING_AMOUNT||0))}${info('Profit Generated',money(x.PROFIT_GENERATED||0))}${info('Loss Generated',money(x.LOSS_GENERATED||0))}${info('Start',fmtDate(x.START_DATE))}${info('Closed At',fmtDate(x.CLOSED_AT))}${info('Status',x.STATUS)}${info('Closing Reference',x.CLOSING_REFERENCE||'-')}${info('Location',x.LOCATION||'-')}${info('Responsible',x.RESPONSIBLE_PERSON||'-')}</div>${c?`<div class="notice section-gap"><b>Closure ${esc(c.CLOSURE_ID)}</b> · Sale ${money(c.SELLING_AMOUNT)} · Cash received ${money(c.CASH_RECEIVED)} · Profit ${money(c.PROFIT_AMOUNT)} · Loss ${money(c.LOSS_AMOUNT)} · TXN ${esc(c.TXN_ID)}</div>`:''}<div class="form-section section-gap">Principal / Profit Returns</div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Transaction</th><th>Status</th><th></th></tr></thead><tbody>${d.returns.map(r=>`<tr><td>${fmtDate(r.RETURN_DATE)}</td><td>${esc(r.TYPE)}</td><td>${money(r.AMOUNT)}</td><td>${esc(r.TXN_ID)}</td><td>${statusBadge(r.STATUS||'POSTED')}</td><td>${canEdit&&(!r.STATUS||r.STATUS==='POSTED')?`<button class="btn btn-red btn-sm" onclick="reverseInvestmentReturnUi('${r.RETURN_ID}','${id}')">Reverse</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">কোনো return নেই।</td></tr>'}</tbody></table></div><div class="form-section section-gap">Linked Profit Records</div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Period</th><th>Amount</th><th>Status</th></tr></thead><tbody>${d.profitRecords.map(p=>`<tr><td>${esc(p.PROFIT_ID)}</td><td>${esc(p.PERIOD_LABEL)}</td><td>${money(p.AMOUNT)}</td><td>${statusBadge(p.STATUS)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">কোনো linked profit নেই।</td></tr>'}</tbody></table></div>`,`<button class="btn btn-light" onclick="closeModal()">বন্ধ</button>${canEdit&&ndOpenInvestmentStatus_(x.STATUS)?`<button class="btn btn-outline" onclick="closeModal();openInvestmentReturnModal('${id}')">Add Return</button><button class="btn btn-gold" onclick="closeModal();openInvestmentCloseModal('${id}')">Sell / Close</button><button class="btn btn-red" onclick="cancelInvestmentUi('${id}')">Cancel Investment</button>`:''}${canEdit&&c?`<button class="btn btn-red" onclick="reverseInvestmentClosureUi('${c.CLOSURE_ID}')">Reverse Closure</button>`:''}`,true);

async function reverseInvestmentReturnUi(returnId,investmentId){const reason=ndFinancialReason_('Are you sure you want to reverse this return? This action will also reverse its cash/ledger effect.');if(!reason)return;try{await api('reverseInvestmentReturn',returnId,reason);toast('Return reversed.');openInvestmentDetails(investmentId)}catch(e){toast(e.message,'error')}}
async function reverseInvestmentClosureUi(closureId){const reason=ndFinancialReason_('Are you sure you want to reverse this investment closure? This action will also reverse its financial and profit effects.');if(!reason)return;try{await api('reverseInvestmentClosure',closureId,reason);closeModal();toast('Closure reversed; investment is open again.');renderInvestments()}catch(e){toast(e.message,'error')}}
async function cancelInvestmentUi(id){const reason=ndFinancialReason_('Are you sure you want to cancel this investment? The purchase transaction and ledger effect will be reversed.');if(!reason)return;try{await api('cancelInvestment',id,reason);closeModal();toast('Investment cancelled and financial effect reversed.');renderInvestments()}catch(e){toast(e.message,'error')}}

async function openProfitDistributionModal(profitId=''){
  const rows=await api('listProfitRecords',{}),available=rows.filter(p=>Number(p.AVAILABLE_AMOUNT)>0&&!['REVERSED','CANCELLED'].includes(p.STATUS));if(!available.length){toast('কোনো undistributed profit available নেই।','error');return}

  const selected=()=>$('#distributionProfit').options[$('#distributionProfit').selectedIndex],methodLabels={MANUAL:'Manual Distribution',SAVINGS:'Savings Amount Based',EQUAL:'Equal Distribution',UNITS:'Unit-Based Distribution'},help={MANUAL:'প্রত্যেক সদস্যের amount আপনি নির্ধারণ করবেন।',SAVINGS:'বর্তমান member savings balance অনুযায়ী proportional allocation হবে।',EQUAL:'সব active member সমান profit পাবে।',UNITS:'Distribution Date-এ কার্যকর savings unit অনুযায়ী proportional allocation হবে।'};let preview=null;
  const invalidate=()=>{preview=null;$('#profitPreview').innerHTML='';$('#createProfitDraft').disabled=true};
  const syncMax=()=>{const max=Number(selected().dataset.available||0),amount=$('#distributionAmount');amount.max=max;if(!amount.value||Number(amount.value)>max)amount.value=max;invalidate()};
  const syncBasis=()=>{$('#distributionBasisHelp').textContent=help[$('#distributionBasis').value]||'';invalidate()};
  $('#distributionProfit').onchange=syncMax;$('#distributionBasis').onchange=syncBasis;$('#distributionAmount').oninput=invalidate;$('#distributionDate').onchange=invalidate;syncMax();syncBasis();
  const updateManualTotals=()=>{if(!preview||preview.basisType!=='MANUAL')return;const target=Number(preview.distributableAmount||0),inputs=$$('#profitPreview .dist-member-amount'),allocated=Math.round(inputs.reduce((z,x)=>z+Number(x.value||0),0)*100)/100,unallocated=Math.round((target-allocated)*100)/100;inputs.forEach(x=>{const tr=x.closest('tr'),rate=target>0?Math.round(Number(x.value||0)/target*10000)/100:0;tr.querySelector('.dist-share-rate').textContent=rate.toFixed(2)+'%'});$('#distAllocationTotal').textContent=money(allocated);$('#distUnallocatedTotal').textContent=money(unallocated);$('#createProfitDraft').disabled=Math.abs(unallocated)>0.009||allocated<=0};
  $('#previewProfit').onclick=async()=>{const f=$('#profitDistributionForm');if(!f.reportValidity())return;try{preview=await api('previewProfitDistribution',formObj(f));const unitBased=preview.basisType==='UNITS',manual=preview.basisType==='MANUAL',basisTitle=unitBased?'Units':preview.basisType==='SAVINGS'?'Savings Balance':preview.basisType==='EQUAL'?'Equal Weight':'Manual',basisValue=r=>unitBased?Number(r.units||0).toLocaleString('en-BD'):preview.basisType==='SAVINGS'?money(r.basis):preview.basisType==='EQUAL'?'1':'—';$('#profitPreview').innerHTML=`<div class="notice section-gap"><b>${methodLabels[preview.basisType]}</b> · Members: ${preview.rows.length}${unitBased?` · Total Units: <b>${Number(preview.totalUnits||0).toLocaleString('en-BD')}</b> · Unit Percentage: <b>${Number(preview.percentageTotal||0).toFixed(2)}%</b>`:''} · Profit: <b>${money(preview.distributableAmount)}</b> · Remaining Profit: <b>${money(preview.remainingAfter)}</b></div><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>${basisTitle}</th><th>${unitBased?'Unit Percentage':'Share Percentage'}</th><th>Credit Amount</th></tr></thead><tbody>${preview.rows.map(r=>`<tr data-member="${esc(r.memberId)}"><td><b>${esc(r.memberId)}</b><br>${esc(r.name)}</td><td>${basisValue(r)}</td><td class="dist-share-rate">${Number(unitBased?r.unitPercentage:r.rate||0).toFixed(2)}%</td><td><input class="input dist-member-amount" type="number" min="0" step="0.01" value="${Number(r.amount||0).toFixed(2)}" ${manual?'':'readonly'}></td></tr>`).join('')}</tbody><tfoot><tr><th colspan="3">Allocated Total</th><th id="distAllocationTotal">${money(preview.allocatedAmount)}</th></tr><tr><th colspan="3">Remaining / Unallocated</th><th id="distUnallocatedTotal">${money(preview.unallocatedAmount)}</th></tr></tfoot></table></div>`;$$('#profitPreview .dist-member-amount').forEach(el=>el.oninput=updateManualTotals);$('#createProfitDraft').disabled=manual;updateManualTotals();if(!manual)$('#createProfitDraft').disabled=Math.abs(Number(preview.unallocatedAmount||0))>0.009}catch(e){preview=null;$('#createProfitDraft').disabled=true;toast(e.message,'error')}};
  $('#createProfitDraft').onclick=async()=>{if(!preview)return;const p=formObj($('#profitDistributionForm'));if(preview.basisType==='MANUAL')p.items=$$('#profitPreview tr[data-member]').map(tr=>({memberId:tr.dataset.member,amount:Number(tr.querySelector('.dist-member-amount').value||0)})).filter(x=>x.amount>0);try{const r=await api('createProfitDistributionDraft',p);closeModal();toast(`Distribution draft ${r.distributionId} created for ${r.count} members${r.basisType==='UNITS'?` using ${r.totalUnits} total units`:''}.`);renderProfitManagement()}catch(e){toast(e.message,'error')}};
}

async function openProfitDistributionDetails(id){
  try{const d=await api('getProfitDistributionDetails',id),h=d.distribution,unitBased=h.BASIS_TYPE==='UNITS',methodLabels={MANUAL:'Manual Distribution',SAVINGS:'Savings Amount Based',EQUAL:'Equal Distribution',UNITS:'Unit-Based Distribution'},basisTitle=unitBased?'Units':'Basis',rateTitle=unitBased?'Unit Percentage':'Share Percentage';modal('Distribution — '+esc(id),`<div class="info-grid">${info('Source',d.source&&d.source.SOURCE_NAME||h.SOURCE_ID)}${info('Period',h.PERIOD_LABEL)}${info('Method',methodLabels[h.BASIS_TYPE]||h.BASIS_TYPE)}${info('Distribution Date',fmtDate(h.DISTRIBUTION_DATE))}${info('Total Profit',money(h.TOTAL_PROFIT))}${info('Requested',money(h.REQUESTED_AMOUNT))}${info('Distributed',money(h.DISTRIBUTED_AMOUNT))}${unitBased?info('Total Units',Number(h.TOTAL_UNITS||h.TOTAL_BASIS||0).toLocaleString('en-BD')):''}${info('Members',h.MEMBER_COUNT)}${info('Status',h.STATUS)}${info('Reference',h.REFERENCE||'-')}${info('Created By',h.CREATED_BY)}${info('Created Date',fmtDate(h.CREATED_AT))}</div><div class="table-wrap section-gap"><table class="table"><thead><tr><th>Member</th><th>${basisTitle}</th>${unitBased?'<th>Total Units</th>':''}<th>${rateTitle}</th><th>Amount</th><th>Transaction</th><th>Status</th></tr></thead><tbody>${d.items.map(r=>`<tr><td><b>${esc(r.MEMBER_ID)}</b><br>${esc(r.MEMBER_NAME)}</td><td>${unitBased?Number(r.UNIT_QUANTITY||0).toLocaleString('en-BD'):h.BASIS_TYPE==='SAVINGS'?money(r.BASIS_AMOUNT):esc(r.BASIS_AMOUNT||'—')}</td>${unitBased?`<td>${Number(r.TOTAL_UNITS||0).toLocaleString('en-BD')}</td>`:''}<td>${Number(unitBased?r.UNIT_PERCENTAGE:r.RATE||0).toFixed(2)}%</td><td>${money(r.AMOUNT)}</td><td>${esc(r.TXN_ID||'-')}</td><td>${statusBadge(r.STATUS)}</td></tr>`).join('')}</tbody><tfoot><tr><th colspan="${unitBased?4:3}">Total</th><th>${money(d.items.reduce((z,r)=>z+Number(r.AMOUNT||0),0))}</th><th colspan="2"></th></tr></tfoot></table></div>`,`<button class="btn btn-light" onclick="closeModal()">Close</button>${h.STATUS==='DRAFT'&&(isAdmin()||hasPerm('profits.edit'))?`<button class="btn btn-green" onclick="approveProfitDistributionUi('${id}')">Approve & Credit Members</button>`:''}${h.STATUS==='APPROVED'&&(isAdmin()||hasPerm('profits.edit'))?`<button class="btn btn-red" onclick="reverseProfitDistributionUi('${id}')">Reverse Distribution</button>`:''}`,true)}catch(e){toast(e.message,'error')}
}
async function approveProfitDistributionUi(id){if(!window.confirm('Approve this distribution? Each member account and ledger will be credited, and duplicate distribution will be prevented.'))return;try{const r=await api('approveProfitDistribution',id);closeModal();toast(`${r.count} member account credited: ${money(r.distributedAmount)}`);renderProfitManagement()}catch(e){toast(e.message,'error')}}
async function cancelProfitDistributionUi(id){const reason=ndFinancialReason_('Cancel this draft distribution? Reserved profit will become available again.');if(!reason)return;try{await api('cancelProfitDistribution',id,reason);closeModal();toast('Distribution draft cancelled.');renderProfitManagement()}catch(e){toast(e.message,'error')}}
async function reverseProfitDistributionUi(id){const reason=ndFinancialReason_('Are you sure you want to reverse this transaction? This action will also reverse its effect on every member balance and ledger.');if(!reason)return;try{await api('reverseProfitDistribution',id,reason);closeModal();toast('Distribution and all member credits reversed.');renderProfitManagement()}catch(e){toast(e.message,'error')}}
async function reverseProfitRecordUi(id){const reason=ndFinancialReason_('Reverse this profit entry? Related draft/approved distributions must be cancelled or reversed first.');if(!reason)return;try{await api('reverseProfitRecord',id,reason);toast('Profit entry and ledger effect reversed.');renderProfitManagement()}catch(e){toast(e.message,'error')}}

window.ND_MODULE_2_READY=true;
</script>
