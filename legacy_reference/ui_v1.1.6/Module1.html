<script id="ndModule1">
async function renderDashboard(){
  if(isMember())return renderMemberDashboard(); const d=await api('getAdminDashboard');ND.dashboard=d;const k=d.kpi;
  setContent(`<div class="page-head"><div><h2>ড্যাশবোর্ড</h2><p>সমিতির বর্তমান অবস্থা ও সাম্প্রতিক কার্যক্রম</p></div><div class="actions"><button class="btn btn-blue btn-sm" onclick="openMemberModal()">＋ সদস্য</button><button class="btn btn-green btn-sm" onclick="openSavingsModal(false)">＋ জমা</button><button class="btn btn-gold btn-sm" onclick="openLoanApplyModal()">＋ ঋণ</button></div></div>
  <div class="kpi-grid">
    ${kpi('👥','মোট সদস্য',k.totalMembers,`Active: ${k.activeMembers} | Inactive: ${k.inactiveMembers}`,'blue')}
    ${kpi('💳','মোট সঞ্চয়',money(k.totalSavings),'সকল সদস্যের নেট সঞ্চয়','green')}
    ${kpi('🪙','আজকের জমা',money(k.todayCollection),'সঞ্চয়, কিস্তি ও অন্যান্য নগদ গ্রহণ','gold')}
    ${kpi('🏛️','মোট ঋণ',money(k.totalLoan),'বিতরণকৃত ঋণ','purple')}
    ${kpi('💵','ক্যাশ/ব্যাংক',money(k.cashBank),'বর্তমান উপলব্ধ ব্যালেন্স','teal')}
    ${kpi('◔','ঋণ বাকি',money(k.loanOutstanding),'Outstanding principal','red')}
  </div>
  <div class="kpi-grid section-gap">
    ${kpi('💼','Total Investment',money(k.totalInvestment||0),'All non-cancelled investment','blue')}
    ${kpi('🟢','Active Investment',money(k.activeInvestment||0),`${k.activeInvestmentCount||0} open`,'green')}
    ${kpi('✅','Closed Investment',money(k.closedInvestment||0),`${k.closedInvestmentCount||0} closed`,'gold')}
    ${kpi('↩','Principal Returned',money(k.principalReturned||0),'Effective principal receipts','teal')}
    ${kpi('📈','Profit Generated',money(k.totalProfitGenerated||0),'Source-linked profit records','green')}
    ${kpi('👥','Profit Distributed',money(k.totalProfitDistributed||0),'Credited to member accounts','blue')}
    ${kpi('⏳','Undistributed Profit',money(k.undistributedProfit||0),'Available for distribution','gold')}
    ${kpi('🗓','Monthly Profit',money(k.monthlyProfit||0),'Current month','purple')}
    ${kpi('📅','Yearly Profit',money(k.yearlyProfit||0),'Current year','teal')}
  </div>
  <div class="grid grid-3 section-gap">
    <div class="card"><div class="card-head"><h3>মাসিক সঞ্চয়ের সারাংশ</h3><small class="muted">শেষ ১২ মাস</small></div><div class="card-body"><div class="chart-box"><canvas id="savingChart"></canvas></div></div></div>
    <div class="card"><div class="card-head"><h3>সঞ্চয়ের ধরন অনুযায়ী</h3></div><div class="card-body"><div class="chart-box"><canvas id="mixChart"></canvas></div></div></div>
    <div class="card"><div class="card-head"><h3>সদস্য স্ট্যাটাস</h3></div><div class="card-body"><div class="member-status"><div class="status-box green"><small>সক্রিয় সদস্য</small><b>${k.activeMembers}</b></div><div class="status-box red"><small>নিষ্ক্রিয় সদস্য</small><b>${k.inactiveMembers}</b></div><div class="status-box gold"><small>বকেয়া সদস্য</small><b>${k.dueMembers}</b></div></div></div><div class="card-head"><h3>দ্রুত অ্যাকশন</h3></div><div class="card-body"><div class="quick-grid">
      <button class="quick-btn" style="background:#1769d2" onclick="openMemberModal()">👥 সদস্য যুক্ত</button><button class="quick-btn" style="background:#0b8a5b" onclick="openSavingsModal(false)">💰 টাকা জমা</button><button class="quick-btn" style="background:#6f46b7" onclick="openSavingsModal(true)">➕ অতিরিক্ত সঞ্চয়</button><button class="quick-btn" style="background:#e98a17" onclick="openLoanApplyModal()">🏦 ঋণ আবেদন</button><button class="quick-btn" style="background:#168ea3" onclick="openLoanPaymentModal()">🧾 কিস্তি আদায়</button><button class="quick-btn" style="background:#d33b3b" onclick="openWithdrawalModal()">💸 টাকা উত্তোলন</button><button class="quick-btn" style="background:#274c77" onclick="renderPage('investments')">💼 Investments</button><button class="quick-btn" style="background:#7c3aed" onclick="renderPage('profits')">📈 Profit Management</button>
    </div></div></div>
  </div>
  <div class="card section-gap"><div class="card-head"><h3>সাম্প্রতিক যোগদানকৃত সদস্য</h3><button class="btn btn-light btn-sm" onclick="renderPage('members')">সব সদস্য দেখুন</button></div><div class="card-body"><div class="recent-members">${d.recentMembers.map((m,i)=>`<div class="recent-member" onclick="renderMemberProfile('${m.memberId}')"><img id="rm_${i}" src="${ND_LOGO_DATA}"><b>${esc(m.name)}</b><small>${esc(m.memberId)}</small><small>${fmtDate(m.joinDate)}</small></div>`).join('')}</div></div></div>
  <div class="grid grid-2 section-gap"><div class="card"><div class="card-head"><h3>সাম্প্রতিক লেনদেন</h3><button class="btn btn-light btn-sm" onclick="renderPage('receipts')">সব দেখুন</button></div><div class="table-wrap"><table class="table"><thead><tr><th>তারিখ</th><th>ট্রানজেকশন</th><th>সদস্য</th><th>ধরন</th><th>পরিমাণ</th></tr></thead><tbody id="recentTxBody">${d.recentTransactions.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.txnId)}</td><td>${esc(x.memberId)}</td><td>${esc(x.type)}</td><td class="amount">${money(x.amount)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><div class="card-head"><h3>সাম্প্রতিক ঋণ আবেদন</h3><button class="btn btn-light btn-sm" onclick="renderPage('loans')">সব দেখুন</button></div><div class="table-wrap"><table class="table"><thead><tr><th>তারিখ</th><th>Loan ID</th><th>সদস্য</th><th>পরিমাণ</th><th>স্ট্যাটাস</th></tr></thead><tbody>${d.recentLoans.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.loanId)}</td><td>${esc(x.memberId)}</td><td class="amount">${money(x.amount)}</td><td>${statusBadge(x.status)}</td></tr>`).join('')}</tbody></table></div></div></div>
  <div class="grid grid-3 section-gap"><div class="card"><div class="card-head"><h3>Profit by Source</h3><button class="btn btn-light btn-sm" onclick="renderPage('profits')">Details</button></div><div class="card-body"><div class="chart-box"><canvas id="profitSourceChart"></canvas></div></div></div><div class="card"><div class="card-head"><h3>Profit by Investment</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Investment</th><th>Profit</th></tr></thead><tbody>${(d.profitAnalytics?.byInvestment||[]).slice(0,8).map(x=>`<tr><td>${esc(x.label)}</td><td class="amount">${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No profit data</td></tr>'}</tbody></table></div></div><div class="card"><div class="card-head"><h3>Profit by Category</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Category</th><th>Profit</th></tr></thead><tbody>${(d.profitAnalytics?.byCategory||[]).slice(0,8).map(x=>`<tr><td>${esc(x.label)}</td><td class="amount">${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No profit data</td></tr>'}</tbody></table></div></div></div>
  <div class="kpi-grid section-gap">${kpi('💼','মোট আয়',money(k.totalIncome),'সিস্টেমে পোস্টেড আয়','blue')}${kpi('🧮','মোট ব্যয়',money(k.totalExpense),'সিস্টেমে পোস্টেড ব্যয়','red')}${kpi('🟢','নিট আয়-ব্যয়',money(k.netBalance),'আয় - ব্যয়','green')}${d.accountBalances.slice(0,3).map(a=>kpi(a.type==='CASH'?'💵':'🏦',a.name,money(a.balance),a.type,'purple')).join('')}</div>`);
  drawDashboardCharts(d);loadRecentMemberPhotos(d.recentMembers);
}
function kpi(icon,label,value,sub,cls=''){return `<div class="kpi ${cls}"><div class="kpi-icon">${icon}</div><div><div class="kpi-label">${tr(label)}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${tr(sub)}</div></div></div>`}
function drawDashboardCharts(d){if(typeof Chart==='undefined'){ndLoadChartJs().then(function(ok){if(ok&&ND.currentPage==='dashboard')drawDashboardCharts(d);});return;}const ctx=$('#savingChart');if(ctx){ND.charts.push(new Chart(ctx,{type:'line',data:{labels:d.monthly.map(x=>x.month.slice(5)),datasets:[{label:'মাসিক চাঁদা',data:d.monthly.map(x=>x.regular),borderColor:'#1769d2',backgroundColor:'rgba(23,105,210,.08)',fill:true,tension:.35},{label:'অতিরিক্ত সঞ্চয়',data:d.monthly.map(x=>x.extra),borderColor:'#22a65b',backgroundColor:'rgba(34,166,91,.06)',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10,font:{size:10}}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:9}}}}}}))}const mix=$('#mixChart');if(mix){ND.charts.push(new Chart(mix,{type:'doughnut',data:{labels:['মাসিক সঞ্চয়','অতিরিক্ত সঞ্চয়'],datasets:[{data:[d.savingsMix.regular,d.savingsMix.extra],backgroundColor:['#1769d2','#22a65b'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:10}}}}}}))}const profit=$('#profitSourceChart'),pa=d.profitAnalytics?.bySource||[];if(profit){ND.charts.push(new Chart(profit,{type:'bar',data:{labels:pa.slice(0,8).map(x=>x.label),datasets:[{label:'Profit',data:pa.slice(0,8).map(x=>x.amount),backgroundColor:'#7c3aed',borderRadius:5}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true},y:{grid:{display:false}}}}}))}}
async function loadRecentMemberPhotos(ms){for(let i=0;i<ms.length;i++){if(!ms[i].photoFileId)continue;try{const data=await api('getMemberPhoto',ms[i].memberId);if(data&&document.getElementById('rm_'+i))document.getElementById('rm_'+i).src=data}catch(e){}}}

async function renderMemberDashboard(){const d=await api('getMemberDashboard');setContent(`<div class="member-dashboard"><div class="page-head"><div><h2>আমার ড্যাশবোর্ড</h2><p>${esc(d.member.name)} · ${esc(d.member.memberId)}</p></div><div class="actions"><button class="btn btn-outline btn-sm" onclick="renderPage('ledger')">📒 লেজার</button><button class="btn btn-outline btn-sm" onclick="renderPage('receipts')">🧾 রিসিট</button></div></div><div class="kpi-grid">${kpi('💰','মোট সঞ্চয়',money(d.summary.savings),'বর্তমান নেট সঞ্চয়','green')}${kpi('📅','মাসিক জমা',money(d.summary.monthlyAmount),`${d.summary.units} ইউনিট`,'blue')}${kpi('⚠️','মোট বকেয়া',money(d.summary.due),'Due balance','gold')}${kpi('🏦','ঋণ বাকি',money(d.summary.loanOutstanding),d.summary.nextLoanDue?'পরবর্তী কিস্তি '+fmtDate(d.summary.nextLoanDue):'কোনো কিস্তি নেই','red')}</div><div class="grid grid-2 section-gap"><div class="card"><div class="card-head"><h3>সাম্প্রতিক লেনদেন</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>তারিখ</th><th>বিবরণ</th><th>ডেবিট</th><th>ক্রেডিট</th><th>রিসিট</th></tr></thead><tbody>${d.recentTransactions.map(t=>`<tr><td>${fmtDate(t.TXN_DATE)}</td><td>${esc(t.DESCRIPTION)}</td><td>${t.DIRECTION==='DEBIT'?money(t.AMOUNT):'-'}</td><td>${t.DIRECTION==='CREDIT'?money(t.AMOUNT):'-'}</td><td>${t.RECEIPT_ID?`<button class="btn btn-light btn-sm" onclick="printReceipt('${t.RECEIPT_ID}')">${esc(t.RECEIPT_ID)}</button>`:'-'}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="card-head"><h3>নোটিশ ও আপডেট</h3></div><div class="card-body">${d.notifications.length?d.notifications.map(n=>`<div class="notice" style="margin-bottom:8px"><b>${esc(n.TITLE)}</b><br>${esc(n.MESSAGE)}<div class="helper">${fmtDate(n.CREATED_AT)}</div></div>`).join(''):'<div class="empty">কোনো নতুন নোটিশ নেই।</div>'}</div></div></div></div>`)}
async function renderMembers(){const rows=await api('listMembers',{limit:500});ND.membersCache=rows;setContent(`<div class="page-head"><div><h2>সদস্য ব্যবস্থাপনা</h2><p>সদস্য, KYC, ছবি, ইউনিট ও লগইন অ্যাকাউন্ট</p></div><div class="actions">${hasPerm('members.edit')?`<button class="btn btn-outline btn-sm" onclick="openProfileRequestsModal()">📝 Profile Requests</button><button class="btn btn-primary btn-sm" onclick="openMemberModal()">＋ নতুন সদস্য</button>`:''}</div></div><div class="card"><div class="card-body"><div class="toolbar"><div class="search"><input class="input" id="memberSearch" placeholder="Member ID, নাম, মোবাইল, NID"></div><select class="select filter-sm" id="memberStatus"><option value="">সব স্ট্যাটাস</option><option>ACTIVE</option><option>INACTIVE</option><option>SUSPENDED</option><option>CLOSED</option></select><button class="btn btn-light btn-sm" id="memberFilterBtn">খুঁজুন</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Member ID</th><th>নাম</th><th>মোবাইল</th><th>যোগদান</th><th>KYC</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead><tbody id="memberRows">${memberRowsHtml(rows)}</tbody></table></div></div></div>`);$('#memberFilterBtn').onclick=async()=>{const r=await api('listMembers',{q:$('#memberSearch').value,status:$('#memberStatus').value,limit:500});$('#memberRows').innerHTML=memberRowsHtml(r)};$('#memberSearch').onkeydown=e=>{if(e.key==='Enter')$('#memberFilterBtn').click()}}
function memberRowsHtml(rows){return rows.length?rows.map(m=>`<tr><td><b>${esc(m.memberId)}</b></td><td>${esc(m.nameBn||m.nameEn)}</td><td>${esc(m.mobile)}</td><td>${fmtDate(m.joinDate)}</td><td>${statusBadge(m.kycStatus)}</td><td>${statusBadge(m.status)}</td><td><button class="btn btn-light btn-sm" onclick="renderMemberProfile('${m.memberId}')">প্রোফাইল</button> ${hasPerm('members.edit')?`<button class="btn btn-outline btn-sm" onclick="openMemberModal('${m.memberId}')">Edit</button>`:''}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">কোনো সদস্য পাওয়া যায়নি।</td></tr>'}
async function renderMemberProfile(memberId){const p=await api('getMemberProfile',memberId);const m=p.member;setContent(`<div class="page-head"><div><h2>সদস্য প্রোফাইল</h2><p>${esc(m.MEMBER_ID)}</p></div><div class="actions">${isMember()?`<button class="btn btn-outline btn-sm" onclick="openMyProfileUpdateRequest()">📝 তথ্য সংশোধনের অনুরোধ</button>`:hasPerm('members.edit')?`<button class="btn btn-outline btn-sm" onclick="openMemberModal('${m.MEMBER_ID}')">✏️ Edit</button>`:''}<button class="btn btn-light btn-sm" onclick="renderLedger('${m.MEMBER_ID}')">📒 Ledger</button></div></div><div class="card"><div class="card-body"><div class="profile-head"><img class="profile-photo" id="profilePhoto" src="${ND_LOGO_DATA}" onclick="openMemberPhoto('${m.MEMBER_ID}')" title="ছবি বড় করে দেখুন"><div class="profile-name"><h2>${esc(m.NAME_BN||m.NAME_EN)}</h2><p>${esc(m.MEMBER_ID)} · ${esc(m.MOBILE||'')} · ${statusBadge(m.STATUS)}</p><p>Join: ${fmtDate(m.JOIN_DATE)} · KYC: ${esc(m.KYC_STATUS)}</p>${m.PHOTO_FILE_ID?`<button class="btn btn-light btn-sm" style="margin-top:6px" onclick="openMemberPhoto('${m.MEMBER_ID}')">🔍 ছবি বড় করে দেখুন</button>`:``}</div><div class="profile-stats"><div class="mini-stat"><small>মোট সঞ্চয়</small><b>${money(p.savingsBalance)}</b></div><div class="mini-stat"><small>বকেয়া</small><b>${money(p.dueBalance)}</b></div><div class="mini-stat"><small>মাসিক ইউনিট</small><b>${p.unit?esc(p.unit.UNITS):0}</b></div><div class="mini-stat"><small>মাসিক জমা</small><b>${p.unit?money(Number(p.unit.UNITS)*Number(p.unit.UNIT_AMOUNT)):money(0)}</b></div><div class="mini-stat"><small>ঋণ বাকি</small><b>${money(p.loanOutstanding)}</b></div><div class="mini-stat"><small>রিসিট</small><b>${p.receipts.length}+</b></div></div></div><div class="tabs" id="profileTabs"><button class="tab active" data-t="overview">Overview</button><button class="tab" data-t="savings">Savings</button><button class="tab" data-t="ledger">Ledger</button><button class="tab" data-t="loans">Loans</button><button class="tab" data-t="receipts">Receipts</button><button class="tab" data-t="nominee">Nominee</button><button class="tab" data-t="documents">Documents</button><button class="tab" data-t="history">History</button></div><div class="tab-panel" id="profilePanel"></div></div></div>`);window._profileData=p;window._profileMemberId=m.MEMBER_ID;$$('#profileTabs .tab').forEach(b=>b.onclick=()=>{$$('#profileTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderProfileTab(b.dataset.t)});renderProfileTab('overview');if(m.PHOTO_FILE_ID){api('getMemberPhoto',m.MEMBER_ID).then(x=>{if(x&&$('#profilePhoto'))$('#profilePhoto').src=x}).catch(()=>{})}}
function renderProfileTab(t){const p=window._profileData,m=p.member,el=$('#profilePanel');if(!el)return;
  if(t==='overview')el.innerHTML=`<div class="info-grid">${info('পিতার নাম',m.FATHER_NAME)}${info('মাতার নাম',m.MOTHER_NAME)}${info('জন্ম তারিখ',fmtDate(m.DOB))}${info('রক্তের গ্রুপ',m.BLOOD_GROUP||'-')}${info('NID',m.NID)}${info('মোবাইল',m.MOBILE)}${info('ইমেইল',m.EMAIL)}${info('পেশা',m.PROFESSION)}${info('বর্তমান ঠিকানা',m.PRESENT_ADDRESS)}${info('স্থায়ী ঠিকানা',m.PERMANENT_ADDRESS)}</div>${m.NID_SCAN_DOCUMENT_ID?`<div class="section-gap notice"><b>${tr('জাতীয় পরিচয়পত্রের স্ক্যান কপি')}</b> <button class="btn btn-outline btn-sm" onclick="openDocument('${m.NID_SCAN_DOCUMENT_ID}')">📎 ${tr('দেখুন')}</button></div>`:''}`;
  if(t==='savings')el.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>তারিখ</th><th>বিবরণ</th><th>পরিমাণ</th><th>রিসিট</th></tr></thead><tbody>${p.transactions.filter(x=>x.CATEGORY==='SAVINGS').map(x=>`<tr><td>${fmtDate(x.TXN_DATE)}</td><td>${esc(x.DESCRIPTION)}</td><td>${money(x.AMOUNT)}</td><td>${x.RECEIPT_ID?`<button class="btn btn-light btn-sm" onclick="printReceipt('${x.RECEIPT_ID}')">Print</button>`:'-'}</td></tr>`).join('')}</tbody></table></div>`;
  if(t==='ledger')el.innerHTML=`<div class="notice">সম্পূর্ণ লেজার দেখতে নিচের বাটনে ক্লিক করুন।</div><br><button class="btn btn-primary btn-sm" onclick="renderLedger('${m.MEMBER_ID}')">📒 সম্পূর্ণ Member Ledger</button>`;

  try{
    const x=await api('getReceipt',receiptId),r=x.receipt,m=x.member,t=x.transaction,docs=x.supportingDocuments||[],note=t?.NOTE_PURPOSE||'';
    modal('রিসিট '+esc(receiptId),`<div class="receipt-paper" id="receiptPaper"><div class="receipt-modern-head"><img src="${ND_LOGO_DATA}"><div class="receipt-brand"><h2>${esc(x.config.nameBn)}</h2><p>${esc(x.config.nameEn)} · ESTD ${esc(x.config.estd)}<br>${esc(x.config.tagline||'')}</p></div><div class="receipt-badge">MONEY RECEIPT</div></div><div class="receipt-body"><div class="receipt-id-line">Receipt No: ${esc(r.RECEIPT_ID)} · TXN: ${esc(t?.TXN_ID||'-')}</div><div class="receipt-meta"><div class="receipt-row"><span>Date</span><b>${fmtDate(r.RECEIPT_DATE)}</b></div><div class="receipt-row"><span>Member ID</span><b>${esc(r.MEMBER_ID)}</b></div><div class="receipt-row"><span>Member</span><b>${esc(m?.NAME_BN||m?.NAME_EN||r.MEMBER_ID)}</b></div><div class="receipt-row"><span>Purpose</span><b>${esc(r.PURPOSE)}</b></div>${note?`<div class="receipt-row"><span>Note / Purpose</span><b>${esc(note)}</b></div>`:''}<div class="receipt-row"><span>Payment Method</span><b>${esc(r.PAYMENT_METHOD)}</b></div><div class="receipt-row"><span>Reference</span><b>${esc(r.REFERENCE||'-')}</b></div></div><div class="receipt-amount">${money(r.AMOUNT)}</div>${docs.length?`<div class="receipt-attachment"><span>📎 Supporting Document / Bank Slip attached</span><div>${docs.map(d=>`<button class="btn btn-light btn-sm no-print" onclick="openDocument('${d.DOCUMENT_ID}')">View Slip</button>`).join('')}</div></div>`:''}<div class="receipt-note">সিস্টেমে সংরক্ষিত অফিসিয়াল রিসিট · পুনরায় Print করলে একই Receipt ID ব্যবহার হবে।</div><div class="receipt-sign"><div>গ্রহণকারীর স্বাক্ষর</div><div>অনুমোদিত স্বাক্ষর</div></div></div></div>`,`<button class="btn btn-light" onclick="closeModal()">বন্ধ</button>${!isMember()&&(isAdmin()||hasPerm('savings.edit')||hasPerm('accounts.edit'))&&['MONTHLY_SAVINGS','EXTRA_SAVINGS'].includes(t?.TYPE)&&t?.STATUS==='POSTED'?`<button class="btn btn-outline" onclick="closeModal();openSavingsEditModal('${t.TXN_ID}')">✏️ Edit Entry</button>`:''}<button class="btn btn-primary" id="doPrintReceipt">🖨️ Print / Save PDF</button>`,true);
    $('#doPrintReceipt').onclick=async()=>{try{await api('recordReceiptPrint',receiptId)}catch(e){}printDocumentOnly('receipt')};
  }catch(e){toast(e.message,'error')}
}

function openCorrectionModal(txnId,category,type,amount){modal('লেনদেন সংশোধন',`<div class="notice warn">Posted transaction সরাসরি Delete হবে না। সিস্টেম Reversal + Corrected Entry তৈরি করবে এবং Audit Log রাখবে।</div><form id="corrForm" class="section-gap"><div class="field"><label>Transaction</label><input class="input" value="${esc(txnId)}" disabled></div><div class="field"><label>বর্তমান Amount</label><input class="input" value="${amount}" disabled></div><div class="field"><label>সঠিক Amount (0 = শুধু Reverse)</label><input class="input" name="newAmount" type="number" min="0" step="0.01" value="${amount}"></div><div class="field"><label>Correction Reason *</label><textarea class="textarea" name="reason" required></textarea></div></form>`,`<button class="btn btn-light" onclick="closeModal()">বাতিল</button><button class="btn btn-red" id="confirmCorrection">Correct Transaction</button>`);$('#confirmCorrection').onclick=async()=>{const f=$('#corrForm');if(!f.reportValidity())return;const p=formObj(f);try{if(category==='SAVINGS')await api('correctSavingsTransaction',txnId,p.newAmount,p.reason);else if(type==='LOAN_PAYMENT')await api('correctLoanPayment',txnId,p.newAmount,p.reason);else await api('correctSimpleTransaction',txnId,p.newAmount,p.reason);closeModal();toast('Correction সফল হয়েছে।');renderPage(ND.currentPage)}catch(e){toast(e.message,'error')}}}

window.ND_MODULE_1_READY=true;
</script>
